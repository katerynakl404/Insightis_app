<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Could not confirm email | Insightis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..900;1,9..40,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../kit-theme.css" />
  <link rel="stylesheet" href="auth-concept.css" />
</head>
<body>
  <header class="au-topnav">
    <a class="au-topnav-brand" href="login.html"><span class="au-brand"></span></a>
    <label class="au-switch">Screen
      <select class="au-switch-sel" data-au-switch aria-label="Switch screen"></select>
    </label>
  </header>
  <main class="au-page">
    <div class="au-card">
      <div class="au-brand"></div>
      <div class="au-status is-error" data-illu="mail-x">
        <svg class="au-illu" viewBox="0 0 140 118" fill="none" aria-hidden="true">
          <ellipse class="il-shadow" cx="70" cy="106" rx="42" ry="5"/>
          <rect class="il-body" x="24" y="34" width="92" height="62" rx="11"/>
          <path class="il-line" d="M27 41l39 27a7 7 0 0 0 8 0l39 -27"/>
          <circle class="il-face" cx="58" cy="80" r="3"/>
          <circle class="il-face" cx="82" cy="80" r="3"/>
          <path class="il-mouth" d="M56 91 q14 -10 28 0"/>
          <circle class="il-badge" cx="104" cy="40" r="14"/>
          <path class="il-badge-x" d="M98 34l12 12M110 34l-12 12"/>
        </svg>
        <h1 class="au-status-title">Could not confirm email</h1>
        <p class="au-status-body">The link may have expired or already been used.</p>
      </div>
      <div class="au-actions">
        <a class="btn btn-primary btn-lg" href="check-email.html">Resend Confirmation Email</a>
      </div>
      <div class="au-links-row"><a class="link" href="login.html">Back to sign in</a></div>
    </div>
  </main>
  <script src="auth-concept.js"></script>
</body>
</html>

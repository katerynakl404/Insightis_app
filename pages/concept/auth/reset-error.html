<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset link invalid | Insightis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..900;1,9..40,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../kit-theme.css" />
  <link rel="stylesheet" href="auth-concept.css" />
</head>
<body>
  <header class="au-topnav">
    <a class="au-topnav-brand" href="login.html"><span class="au-brand"></span></a>
    <label class="au-switch">Screen
      <select class="au-switch-sel" data-au-switch aria-label="Switch screen"></select>
    </label>
  </header>
  <main class="au-page">
    <div class="au-card">
      <div class="au-brand"></div>
      <div class="au-status is-error" data-illu="shield-alert">
        <svg class="au-illu" viewBox="0 0 140 118" fill="none" aria-hidden="true">
          <ellipse class="il-shadow" cx="70" cy="108" rx="36" ry="5"/>
          <path class="il-line" d="M52 56V44a18 18 0 0 1 36 0v12"/>
          <rect class="il-body" x="38" y="56" width="64" height="48" rx="11"/>
          <circle class="il-face" cx="60" cy="78" r="3"/>
          <circle class="il-face" cx="80" cy="78" r="3"/>
          <path class="il-mouth" d="M58 92 q12 -9 24 0"/>
          <circle class="il-badge" cx="100" cy="54" r="13"/>
          <path class="il-badge-x" d="M95 49l10 10M105 49l-10 10"/>
        </svg>
        <h1 class="au-status-title">Reset link invalid or expired</h1>
        <p class="au-status-body">We'll email you a fresh link to try again.</p>
      </div>
      <div class="au-actions"><a class="btn btn-primary btn-lg" href="forgot-password.html">Request a New Link</a></div>
    </div>
  </main>
  <script src="auth-concept.js"></script>
</body>
</html>

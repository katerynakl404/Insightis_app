<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email confirmed | Insightis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..900;1,9..40,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../kit-theme.css" />
  <link rel="stylesheet" href="auth-concept.css" />
</head>
<body>
  <header class="au-topnav">
    <a class="au-topnav-brand" href="login.html"><span class="au-brand"></span></a>
    <label class="au-switch">Screen
      <select class="au-switch-sel" data-au-switch aria-label="Switch screen"></select>
    </label>
  </header>
  <main class="au-page">
    <div class="au-card">
      <div class="au-brand"></div>
      <div class="au-status is-success" data-illu="circle-check">
        <div class="au-status-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg></div>
        <h1 class="au-status-title">Email confirmed</h1>
        <p class="au-status-body">Add your name to finish setting up your account.</p>
      </div>
      <form class="au-form" onsubmit="location.href='login.html';return false">
        <div class="au-field">
          <div class="igrp var-outline is-xl">
            <span class="igrp-add" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <input class="igrp-input" type="text" autocomplete="given-name" aria-label="First name" placeholder="First name" />
          </div>
        </div>
        <div class="au-field">
          <div class="igrp var-outline is-xl">
            <span class="igrp-add" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <input class="igrp-input" type="text" autocomplete="family-name" aria-label="Last name" placeholder="Last name" />
          </div>
        </div>
        <div class="au-actions"><button type="submit" class="btn btn-primary btn-lg">Continue</button></div>
      </form>
    </div>
  </main>
  <script src="auth-concept.js"></script>
</body>
</html>

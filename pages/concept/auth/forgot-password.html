<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password | Insightis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..900;1,9..40,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../kit-theme.css" />
  <link rel="stylesheet" href="auth-concept.css" />
</head>
<body>
  <header class="au-topnav">
    <a class="au-topnav-brand" href="login.html"><span class="au-brand"></span></a>
    <label class="au-switch">Screen
      <select class="au-switch-sel" data-au-switch aria-label="Switch screen"></select>
    </label>
  </header>
  <main class="au-page">
    <div class="au-card">
      <div class="au-brand"></div>
      <div class="au-head">
        <h1 class="au-title">Reset your password</h1>
        <p class="au-sub">Enter your account email and we'll send you a link to reset your password</p>
      </div>
      <form class="au-form" onsubmit="location.href='reset-sent.html';return false">
        <div class="au-field">
          <div class="igrp var-outline is-xl">
            <span class="igrp-add" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
            <input class="igrp-input" id="fp-email" type="email" autocomplete="email" aria-label="Email" placeholder="Email" />
          </div>
        </div>
        <div class="au-actions"><button type="submit" class="btn btn-primary btn-lg">Send Reset Link</button></div>
      </form>
      <div class="au-links-row"><a class="link" href="login.html">Back to sign in</a></div>
    </div>
  </main>
  <script src="auth-concept.js"></script>
</body>
</html>

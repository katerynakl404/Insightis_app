<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Insightis · Email already registered</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..900;1,9..40,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../kit-theme.css" />
  <link rel="stylesheet" href="auth-concept.css" />
</head>
<body>
  <header class="au-topnav">
    <a class="au-topnav-brand" href="login.html"><span class="au-brand"></span></a>
    <label class="au-switch">Screen
      <select class="au-switch-sel" data-au-switch aria-label="Switch screen"></select>
    </label>
  </header>
  <main class="au-page">
    <div class="au-card">
      <div class="au-brand"></div>
      <div class="au-head"><h1 class="au-title">Create your account</h1></div>
      <form class="au-form" onsubmit="location.href='check-email.html';return false">
        <div class="au-alert is-error" role="alert"><svg class="au-alert-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg><span>This email is already registered. Sign in instead</span></div>
        <div class="au-field">
          <div class="igrp var-outline is-xl">
            <span class="igrp-add" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
            <input class="igrp-input" id="reg-email" type="email" autocomplete="email" aria-label="Email" placeholder="Email" value="you@example.com" />
          </div>
        </div>
        <div class="au-field">
          <div class="igrp var-outline is-xl">
            <span class="igrp-add" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input class="igrp-input" id="reg-pw" type="password" autocomplete="new-password" aria-label="Password" placeholder="Password" />
            <button type="button" class="au-eye" aria-pressed="false" aria-label="Show password" data-au-eye>
              <svg class="au-eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="au-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
            </button>
          </div>
          <div class="au-req" data-au-req="reg-pw" aria-live="polite">
            <div class="au-req-top"><span class="au-req-title">Password strength</span><span class="au-req-level" data-au-req-level></span></div>
            <div class="au-req-bar"><i class="au-req-bar-fill" data-au-req-fill></i></div>
            <ul class="au-req-list">
              <li data-rule="min">At least 8 characters</li>
              <li data-rule="upper">1+ uppercase (A–Z)</li>
              <li data-rule="lower">1+ lowercase (a–z)</li>
              <li data-rule="digit">1+ number (0–9)</li>
              <li data-rule="symbol">1+ symbol (!@#$)</li>
            </ul>
          </div>
        </div>
        <div class="au-terms">
          <span class="cbx" role="checkbox" aria-checked="false" tabindex="0" data-au-cbx><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
          <span>I accept <a class="link" href="https://insightis-landing.vercel.app/security/terms" target="_blank" rel="noopener">Terms of Service</a></span>
        </div>
        <div class="au-actions"><button type="submit" class="btn btn-primary btn-lg">Continue</button></div>
      </form>
      <p class="au-foot">Already have an account? <a class="link" href="login.html">Sign in</a></p>
      <div class="au-or"><span class="au-or-line"></span><span class="au-or-text">Or</span><span class="au-or-line"></span></div>
      <div class="au-actions">
        <a class="btn btn-secondary btn-lg au-google" href="https://katerynakl404.github.io/Insightis_app/pages/approved/chat-landing.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg><span>Continue with Google</span></a>
      </div>
    </div>
  </main>
  <script src="auth-concept.js"></script>
</body>
</html>

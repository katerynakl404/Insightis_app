<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set new password | Insightis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..900;1,9..40,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../kit-theme.css" />
  <link rel="stylesheet" href="auth-concept.css" />
</head>
<body>
  <header class="au-topnav">
    <a class="au-topnav-brand" href="login.html"><span class="au-brand"></span></a>
    <label class="au-switch">Screen
      <select class="au-switch-sel" data-au-switch aria-label="Switch screen"></select>
    </label>
  </header>
  <main class="au-page">
    <div class="au-card">
      <div class="au-brand"></div>
      <div class="au-head">
        <h1 class="au-title">Set your new password</h1>
        <p class="au-sub">Enter and confirm the new password for your account <strong class="au-strong">yo•••@example.com</strong></p>
      </div>
      <form class="au-form" onsubmit="location.href='reset-done.html';return false">
        <div class="au-field">
          <div class="igrp var-outline is-xl">
            <span class="igrp-add" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input class="igrp-input" id="rp-pw" type="password" autocomplete="new-password" aria-label="New password" placeholder="New password" />
            <button type="button" class="au-eye" aria-pressed="false" aria-label="Show password" data-au-eye>
              <svg class="au-eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="au-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
            </button>
          </div>
          <div class="au-req" data-au-req="rp-pw" aria-live="polite">
            <div class="au-req-top"><span class="au-req-title">Password strength</span><span class="au-req-level" data-au-req-level></span></div>
            <div class="au-req-bar"><i class="au-req-bar-fill" data-au-req-fill></i></div>
            <ul class="au-req-list">
              <li data-rule="min">At least 8 characters</li>
              <li data-rule="upper">1+ uppercase (A–Z)</li>
              <li data-rule="lower">1+ lowercase (a–z)</li>
              <li data-rule="digit">1+ number (0–9)</li>
              <li data-rule="symbol">1+ symbol (!@#$)</li>
            </ul>
          </div>
        </div>
        <div class="au-field">
          <div class="igrp var-outline is-xl">
            <span class="igrp-add" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input class="igrp-input" id="rp-confirm" type="password" autocomplete="new-password" aria-label="Confirm new password" placeholder="Confirm new password" data-au-confirm="rp-pw" />
            <button type="button" class="au-eye" aria-pressed="false" aria-label="Show password" data-au-eye>
              <svg class="au-eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="au-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
            </button>
          </div>
          <span class="au-field-msg" data-au-confirm-msg="rp-confirm"></span>
        </div>
        <div class="au-actions"><button type="submit" class="btn btn-primary btn-lg">Reset Password</button></div>
      </form>
    </div>
  </main>
  <script src="auth-concept.js"></script>
</body>
</html>

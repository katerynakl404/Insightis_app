<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insightis · Reset password</title>
<link rel="stylesheet" href="../../../../ds-bundle/styles.css">
<link rel="stylesheet" href="../../../insightis-kit/insightis-kit.css">
<script src="../../../../ds-bundle/_vendor/react.js"></script>
<script src="../../../../ds-bundle/_ds_bundle.js"></script>
<script src="../../../insightis-kit/insightis-kit.js"></script>
<script>InsightisKit.AuthLayout.initTheme();</script>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var IK = window.InsightisKit, h = IK.h;
  function App() {
    return h(IK.AuthLayout, { screen: 'forgot-password.html' },
      h(IK.AuthCard, {
        title: 'Reset your password',
        subtitle: 'Enter your account email and we\'ll send you a link to reset your password'
      },
        h(IK.AuthCard.Form, { next: 'reset-sent.html', submit: 'Send reset link' },
          h(IK.AuthField, { kind: 'email', id: 'fp-email' })),
        h(IK.AuthCard.Links, { links: [{ href: 'login.html', label: 'Back to sign in' }] })));
  }
  IK.mount(App);
})();
</script>
</body>
</html>

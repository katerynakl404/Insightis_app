<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insightis · Reset link sent</title>
<link rel="stylesheet" href="../../../../ds-bundle/styles.css">
<link rel="stylesheet" href="../../../insightis-kit/insightis-kit.css?v=fe9665bc42">
<link rel="stylesheet" href="../../../review-kit/review-kit.css?v=fe9665bc42">
<script src="../../../../ds-bundle/_vendor/react.js"></script>
<script src="../../../../ds-bundle/_ds_bundle.js"></script>
<script src="../../../insightis-kit/insightis-kit.js?v=fe9665bc42"></script>
<script src="../../../review-kit/review-kit.js?v=fe9665bc42"></script>
<script>InsightisKit.AuthLayout.initTheme();</script>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var IK = window.InsightisKit, RK = window.ReviewKit, h = IK.h;
  function App() {
    return h(IK.Fragment, null,
      h(RK.AuthReviewNav, { screen: 'reset-sent.html' }),
      h(IK.AuthLayout, null,
        h(IK.AuthCard, null,
          h(IK.AuthStatus, { glyph: 'mail', tone: 'info', title: 'Check your email' },
            'We sent a reset link to ', h(IK.AuthStatus.Strong, null, 'you@example.com'),
            '. Open it to choose a new password.'),
          h(IK.AuthCard.Actions, null, h(IK.AuthResendButton, { seconds: 45 })),
          h(IK.AuthCard.Links, { links: [
            { href: 'forgot-password.html', label: 'Try another email' },
            { href: 'login.html', label: 'Back to sign in' }] }))));
  }
  IK.mount(App);
})();
</script>
</body>
</html>

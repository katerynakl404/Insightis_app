<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insightis · Set new password</title>
<link rel="stylesheet" href="../../../../ds-bundle/styles.css">
<link rel="stylesheet" href="../../../insightis-kit/insightis-kit.css">
<script src="../../../../ds-bundle/_vendor/react.js"></script>
<script src="../../../../ds-bundle/_ds_bundle.js"></script>
<script src="../../../insightis-kit/insightis-kit.js"></script>
<script>InsightisKit.AuthLayout.initTheme();</script>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var IK = window.InsightisKit, h = IK.h, R = window.React;
  function App() {
    /* the new password, so the confirm field can say when it does not match */
    var s = R.useState(''), pw = s[0], setPw = s[1];
    return h(IK.AuthLayout, { screen: 'reset-password.html' },
      h(IK.AuthCard, {
        title: 'Set your new password',
        subtitle: h(IK.Fragment, null, 'Enter and confirm the new password for your account ',
          h(IK.AuthStatus.Strong, null, 'yo•••@example.com'))
      },
        h(IK.AuthCard.Form, { next: 'reset-done.html', submit: 'Reset password' },
          h(IK.AuthField, { kind: 'password', id: 'rp-pw', placeholder: 'New password', autoComplete: 'new-password', strength: true, onValueChange: setPw }),
          h(IK.AuthField, { kind: 'password', id: 'rp-confirm', placeholder: 'Confirm new password', autoComplete: 'new-password', matches: pw }))));
  }
  IK.mount(App);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insightis · Check your email</title>
<link rel="stylesheet" href="../../../../ds-bundle/styles.css">
<link rel="stylesheet" href="../../../insightis-kit/insightis-kit.css">
<script src="../../../../ds-bundle/_vendor/react.js"></script>
<script src="../../../../ds-bundle/_ds_bundle.js"></script>
<script src="../../../insightis-kit/insightis-kit.js"></script>
<script>InsightisKit.AuthLayout.initTheme();</script>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var IK = window.InsightisKit, h = IK.h;
  function App() {
    return h(IK.AuthLayout, { screen: 'check-email.html' },
      h(IK.AuthCard, null,
        h(IK.AuthStatus, { glyph: 'mail', tone: 'info', title: 'Check your email' },
          'We sent a confirmation link to ', h(IK.AuthStatus.Strong, null, 'you@example.com'),
          '. Open it to verify your account before signing in.'),
        h(IK.AuthCard.Actions, null, h(IK.AuthResendButton, { seconds: 45 })),
        h(IK.AuthCard.Links, { links: [
          { href: 'register.html', label: 'Try another email' },
          { href: 'login.html', label: 'Back to sign in' }] })));
  }
  IK.mount(App);
})();
</script>
</body>
</html>

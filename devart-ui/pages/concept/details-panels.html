<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insightis · Details panels</title>
<link rel="stylesheet" href="../../../ds-bundle/styles.css">
<link rel="stylesheet" href="../../insightis-kit/insightis-kit.css?v=9fd3fa3024">
<link rel="stylesheet" href="../../review-kit/review-kit.css?v=9fd3fa3024">
<script src="../../../ds-bundle/_vendor/react.js"></script>
<script src="../../../ds-bundle/_ds_bundle.js"></script>
<script src="../../insightis-kit/insightis-kit.js?v=9fd3fa3024"></script>
<script src="../../review-kit/review-kit.js?v=9fd3fa3024"></script>
</head>
<body>
<div id="root"></div>
<script>
/* Details panels — the three side panels (a connection on Data Sources, a metric on Metrics, a file on
   Files) on ONE anatomy, side by side at their real widths and the Sheet's full height (user, 2026-10-20:
   "уніфіковані з різними станами" · "мали бути реальні ширини" · "верни перемикач станів"). IK.DetailsPanel.

   Widths: Connection and Metric Details — one Sheet width, 26.25rem (420px, .ik-dp-sheet; the product's Connection
   Details is DevartUI's 24rem today); the file preview — 28rem (448px, its default, resizable 320–720).

   One rule for the actions, every panel (user, 2026-10-20: "проаналізуй екшени, можливості уніфікації, але
   без шкоди юзабіліті"): each action once per panel.
     in place   an action that belongs to a property sits by it — Add Metric (+ after the count), re-test
                (after Last check), Share (in Access), Active (the head's switch)
     item       what is done with the item itself — Actions switch:
                  Split   (default) the general ones — Edit, Duplicate, Delete / Disconnect — under a chevron in
                          the head (one alone: its icon); what is particular to the item or the page — Remove from
                          Workspace, Duplicate & Customize, Connect — at the foot; a file keeps its icons on top, the
                          preview wants the room (user, 2026-10-20)
                  Top     as the file preview's head: the item's verbs as icons with tooltips, the main one first,
                          the destructive one last (a red icon; ⋮ only for two or more), no rules between (user, 2026-10-20: "з дівайдерами дуже погано"); no foot
                  Bottom  as Connection / Metric Details today: a foot, destructive left, the main one right
   Per state — what can't be done is absent, what a plan brings back is locked (the brief):
     Connection  own: Edit · Disconnect · Free: Edit, Add Metric, Share locked, no re-test, Disconnect free
                 · workspace page: Remove from Workspace · shared: nothing to change · unavailable: why
     Metric      custom: Active, Edit · Duplicate · Delete · built-in: Active, Duplicate & Customize · not
                 connected: Connect · shared with its connection, so Access shares the connection
                 · shared, and on a workspace page: read-only, no switch, nothing to do
     File        own: Share, Add to Chat · Download · Delete (no Rename — a file has no Rename (user, 2026-10-20: «забирай — його не буде»)) · workspace page: Download · Remove from
                 Workspace · shared: Add to Chat · Download · unavailable: why
   Review switches: State · Actions (Top · Bottom) · Layout (Rows · Stacked · Cards) · Description (Short ·
   Long · None — a description can be long or absent: full width under the name, four lines then Show More). */
(function () {
  var IK = window.InsightisKit, RK = window.ReviewKit, D = window.DevartUI, R = window.React, h = IK.h;
  var NOW = Date.now();
  var MINE = [{ name: 'Sales', href: '#', owner: 'You', members: 3 }, { name: 'Support', href: '#', owner: 'You', members: 2 }];
  var THEIRS = [{ name: 'Marketing', href: '#', owner: 'Olena Petrenko', members: 3 }, { name: 'Brand', href: '#', owner: 'Olena Petrenko', members: 2 }];
  /* Connection and Metric — one Sheet width, 420px (user, 2026-10-20: "мали б мати однакову ширину"); the file
     preview is the Files page's split column, 448px by default */
  var WIDTH = { conn: '26.25rem', metric: '26.25rem', file: '28rem' };
  var HEIGHT = 'min(48rem, calc(100svh - 9rem))';
  var TEXT = {
    conn: { short: 'Deals, contacts & pipeline metrics',
      long: 'Deals, contacts and the whole sales pipeline of the EMEA and AMER teams — every opportunity since 2021, synced every 30 minutes. It feeds the revenue, win-rate and forecast metrics; the APAC instance is connected separately as APAC CRM, and test accounts are filtered out at the source.' },
    shared: { short: 'Campaign performance and leads',
      long: 'Campaign performance, leads and lifecycle stages for every paid and organic channel the marketing team runs. Synced hourly; spend comes from the ad platforms through HubSpot, so it lags a day behind the leads.' },
    def: { short: 'Month-over-month change in MRR',
      long: '(MRR this month − MRR last month) ÷ MRR last month × 100. MRR counts the subscriptions active on the last day of the month, net of discounts; one-off charges, refunds and trials are left out, and an upgrade or a downgrade counts in the month it takes effect.' },
    rev: { short: 'Closed-won amount, net of refunds',
      long: 'The amount of every deal closed-won in the period, net of the refunds issued against it in the same period. Multi-year deals count their first year only; the currency is converted at the rate of the close date.' },
    win: { short: 'Won deals as a share of closed deals',
      long: 'Won deals as a share of all deals closed in the period — won and lost. Deals closed as duplicates or spam are left out, so the rate can differ from the CRM’s own report.' }
  };

  function toast(t) { return function () { D.toast(t); }; }
  function lockable(feature, locked, node) { return locked ? h(IK.Locked, { feature: feature, locked: true, surface: 'modal' }, node) : node; }
  function btn(variant, label, icon, onClick) { return h(D.Button, { variant: variant, size: 'sm', type: 'button', leftSlot: icon ? h(IK.Icon, { name: icon, size: 16 }) : undefined, onClick: onClick || toast(label) }, label); }
  function share(free, label) { return lockable('workspaces', free, btn('secondary', label || 'Share via Workspace', 'ws-share')); }
  function badges(alias, custom) {
    return h('span', { className: 'flex flex-wrap items-center gap-2' }, h(D.Badge, { variant: 'secondary', size: 'sm' }, alias), h(D.Badge, { variant: custom ? 'primary' : 'secondary', size: 'sm' }, custom ? 'Custom' : 'Built-in'));
  }
  function activeSwitch(free) {
    return h('div', { className: 'flex items-center gap-1.5' },
      lockable('metrics', free, h('span', { className: 'inline-flex' }, h(D.Switch, { size: 'sm', checked: !free, disabled: free, 'aria-label': 'Toggle active' }))),
      h(D.Typography, { element: 'span', textStyle: 'body14', textColor: 'secondary' }, free ? 'Inactive' : 'Active'));
  }
  /* the file preview's own content — the same sample table, JSON and no-preview view, and the truncated strip
     under the head for a sample of a bigger file (user, 2026-10-20: "превью в файлі мало бути реалістичним") */
  /* a previewed file folds its details: the meta line's facts become rows, as the other panels' properties */
  function fileRows(type, size, origin, date) {
    return [{ label: 'Type', value: type }, { label: 'Size', value: size }, { label: 'Origin', value: h(D.Badge, { variant: origin === 'Artifact' ? 'primary' : 'secondary', size: 'sm' }, origin) }, { label: 'Modified', value: date }];
  }
  function real(name, size) {
    var f = { name: name, size: size };
    /* the file: the preview takes the room, its truncated strip flush on top — the file preview's own (user,
       2026-10-20: "алерт був до верху прикріплений") — the details folded above it */
    return { foldDetails: true, preview: h(IK.DsFilePreviewContent, { file: f, bare: true, onDownload: toast('Download') }),
      previewBanner: h(IK.DsFilePreviewBanner, { file: f, onDownload: toast('Download') }) };
  }

  /* ── the item's own actions, placed by the Actions switch ── */
  /* the item's own actions — the kit's one model (IK.detailsPlace): Top → the head, Bottom → the foot */
  function A(label, icon, o) { return Object.assign({ label: label, icon: icon, onClick: toast(label) }, o || {}); }
  function place(acts, at) { return IK.detailsPlace(acts, at); }

  function placeholder(kind, text) {
    return h('div', { className: 'flex items-center justify-center rounded-lg border border-dashed border-stroke p-6 text-center', style: { width: WIDTH[kind], maxWidth: '100%', height: '12rem' } },
      h(D.Typography, { element: 'p', textStyle: 'body14', textColor: 'secondary', className: 'm-0' }, text));
  }

  /* ── one panel per item and state ── */
  function build(kind, s, o) {
    /* the placement (Split · Top · Bottom); a file keeps its icons on top in Split — the preview wants the room */
    /* a file always keeps Download its icon and the rest in a kebab — the preview wants the room (user, 2026-10-21) */
    var top = o.actions, fileAt = 'kebab', free = s === 'free', desc = o.desc;
    function about(label, key) { return desc === 'none' ? null : { label: label, text: TEXT[key][desc] }; }
    /* the problem and the way back — Ask Owner to Renew / Upgrade — in the mark's popover by the name; no alert in Access
       (user, 2026-10-20: "виглядає завеликою помилкою" · "можливо ріквест прям тут засунути?") */
    function mark(noun, feature, quiet) { return h(IK.WsUnavailableMark, { by: 'Olena Petrenko', locked: s === 'plan', noun: noun, feature: feature, renewal: o.renewal, withAction: !quiet }); }
    /* a file that can't be used: its preview's place says why and offers the way back — the file preview's own
       no-preview view (.ik-dsfp-empty), so every file panel keeps one shape (user, 2026-10-20: "ти не всі файли поправив") */
    function unavailableFile() { return h(IK.DsFileUnavailable, { by: 'Olena Petrenko', locked: s === 'plan', renewal: o.renewal }); }
    var off = s === 'blocked' ? 'blocked' : s === 'plan' ? 'plan' : null;
    var theirs = s === 'shared' || off;
    var p;

    if (kind === 'conn') {
      if (s === 'library') return placeholder(kind, 'A connection has no such state — it is connected or it is not');
      if (theirs) {
        p = { title: 'Connection details', mark: h(IK.ConnectorMark, { connector: 'HubSpot', size: 'md' }), name: 'Campaigns HubSpot', meta: 'HubSpot',
          after: off ? mark('connections', 'connections') : null,
          description: about('Description', 'shared'),
          rows: [{ label: 'Metrics', value: off ? '4 metrics' : h(D.LinkButton, { href: '#' }, '4 metrics') },
                 { label: 'Last check', value: h(IK.DsLastCheck, { lastSync: NOW - 60 * 60e3, status: 'active' }) }],
          access: { items: THEIRS } };
      } else {
        var other = s === 'other';
        p = Object.assign({ title: 'Connection details', mark: h(IK.ConnectorMark, { connector: other ? 'Stripe' : 'Salesforce', size: 'md' }), name: other ? 'Stripe Payments' : 'Main CRM', meta: other ? 'Stripe' : 'Salesforce',
          description: about('Description', 'conn'),
          rows: [
            /* none yet: Add Metric itself, labelled — the real panel's button, not "No metrics" and a glyph */
            other ? { label: 'Metrics', value: btn('secondary', 'Add Metric', 'plus', toast('Create metric opens here')) }
            : { label: 'Metrics', value: h(D.LinkButton, { href: '#' }, '12 metrics'),
              action: { icon: 'plus', label: 'Add Metric', onClick: toast('Create metric opens here'), locked: free, lockFeature: 'metrics' } },
            { label: 'Last check', value: other
              ? h(IK.DsLastCheck, { lastSync: NOW - 26 * 3600e3, status: 'error', error: 'API key expired or revoked (HTTP 401)', onTest: toast('Checking…'), onDetails: toast('Check failed: API key expired or revoked (HTTP 401)') })
              : h(IK.DsLastCheck, { lastSync: NOW - 32 * 60e3, status: 'active', onTest: free ? undefined : toast('Checking…') }) }],
          access: { items: s === 'inws' || s === 'wspage' ? MINE : [], action: share(free), onRemove: function (it) { D.toast.success('Main CRM removed from ' + it.name); } } },
          place({ main: [A('Edit', 'rename', { feature: 'connection-edit', locked: free })], danger: [A('Disconnect', 'disconnect')],
            specific: s === 'wspage' ? [A('Remove from Workspace', 'ws-remove', { danger: true })] : [] }, top));
      }
    }

    if (kind === 'metric') {
      /* on a workspace page a metric opens read-only (IK.WsMetrics → kind 'readonly'): no switch, nothing to do — it
         goes with its connection (user, 2026-10-20: "метрики також відкривають панель у воркспейсах") */
      if (theirs) {
        p = { title: 'Metric details', mark: h(IK.ConnectorMark, { connector: 'HubSpot', size: 'md' }), name: 'Revenue', meta: badges('@revenue__a3f9c1', true),
          after: off ? mark('metrics', 'metrics') : null,
          description: about('Definition', 'rev'),
          rows: [{ label: 'Linked to', value: 'Campaigns HubSpot · HubSpot' }],
          access: { items: THEIRS } };
      } else if (s === 'library') {
        p = { title: 'Metric details', mark: h(IK.ConnectorMark, { connector: 'Google Analytics', size: 'md' }), name: 'Sessions', meta: badges('@sessions', false),
          description: desc === 'none' ? null : { label: 'Definition', text: desc === 'long' ? 'Visits to the website — a session ends after 30 minutes without activity or at midnight; a visit that crosses midnight counts twice. Bots and internal traffic are filtered out by the property’s own settings.' : 'Visits to the website' },
          rows: [{ label: 'Linked to', value: 'Google Analytics' }],
          foot: { block: h('div', { className: 'ik-mx-connect flex flex-col gap-3' },
            h('div', { className: 'flex items-start gap-2.5' },
              h(IK.Icon, { name: 'info', size: 16, className: 'ik-mx-connect-ic' }),
              h(D.Typography, { element: 'p', textStyle: 'body14', textColor: 'body', className: 'ik-mx-connect-copy m-0 min-w-0 flex-1' },
                'This metric is designed for ', h('strong', { className: 'font-semibold text-ink-primary' }, 'Google Analytics'),
                '. Adding a connection activates all its metrics at once — no manual setup needed.')),
            h(D.Button, { variant: 'primary', size: 'md', className: 'w-full', type: 'button', onClick: toast('Connect Google Analytics') }, 'Connect Google Analytics')) } };
      } else {
        var builtin = s === 'other';
        p = Object.assign({ title: 'Metric details', control: activeSwitch(free), mark: h(IK.ConnectorMark, { connector: 'Salesforce', size: 'md' }),
          name: builtin ? 'Win rate' : 'MRR growth', meta: badges(builtin ? '@win_rate' : '@mrr_growth', !builtin),
          description: about('Definition', builtin ? 'win' : 'def'),
          rows: [{ label: 'Linked to', value: 'Main CRM · Salesforce' }],
          access: { items: s === 'inws' || s === 'wspage' ? MINE : [], empty: 'Not shared yet',
            note: { label: 'Goes with its connection, Main CRM', text: 'Every workspace Main CRM is in sees this metric — share or remove the connection to change that' },
            action: share(free, 'Share Main CRM') } },
          builtin
            ? place({ specific: [A('Duplicate & Customize', 'copy', { short: 'Duplicate', tip: 'Duplicate & Customize — your own copy with a custom formula', feature: 'metrics', locked: free })], mainVariant: 'secondary',
                note: h('div', { className: 'flex min-w-0 flex-col' },
                  h(D.Typography, { element: 'span', textStyle: 'label14', textColor: 'primary' }, 'Duplicate & Customize'),
                  h(D.Typography, { element: 'span', textStyle: 'body12', textColor: 'secondary' }, 'Your own copy with a custom formula')) }, top)
            : place({ main: [A('Edit', 'rename', { feature: 'metrics', locked: free })], more: [A('Duplicate', 'copy', { feature: 'metrics', locked: free })], danger: [A('Delete', 'delete')] }, top));
      }
    }

    if (kind === 'file') {
      if (s === 'library') return placeholder(kind, 'A file has no such state');
      if (theirs) {
        p = Object.assign({ title: 'File details', mark: h(IK.DsFileMark, { type: 'pdf' }), name: 'Campaign brief — autumn launch.pdf', meta: 'PDF · 1.1 MB · Uploaded',
          after: off ? mark('files', 'shared-files', true) : null,
          rows: fileRows('PDF', '1.1 MB', 'Uploaded', 'Oct 15, 2026'), access: { items: THEIRS } },
          off ? { foldDetails: true, preview: unavailableFile() } : real('Campaign brief — autumn launch.pdf', '1.1 MB'),
          off ? {} : place({ more: [A('Add to Chat', 'add-chat')], main: [A('Download', 'download')] }, fileAt));
      } else {
        var json = s === 'other';
        p = Object.assign({ title: 'File details', mark: h(IK.DsFileMark, { type: json ? 'json' : 'csv' }), name: json ? 'pipeline-export.json' : 'quarterly-report.csv',
          meta: json ? 'JSON · 84 KB · Uploaded' : 'CSV · 2.4 MB · Artifact',
          rows: json ? fileRows('JSON', '84 KB', 'Uploaded', 'Oct 16, 2026') : fileRows('CSV', '2.4 MB', 'Artifact', 'Oct 16, 2026'),
          access: { items: s === 'inws' || s === 'wspage' ? MINE.slice(0, 1) : [], action: share(free), onRemove: function (it) { D.toast.success('quarterly-report.csv removed from ' + it.name); } } },
          json ? real('pipeline-export.json', '84 KB') : real('quarterly-report.csv', '2.4 MB'),
          place({ more: [A('Add to Chat', 'add-chat')], main: [A('Download', 'download')], danger: [A('Delete', 'delete')],
            specific: s === 'wspage' ? [A('Remove from Workspace', 'ws-remove', { danger: true })] : [] }, fileAt));
      }
    }
    return h(IK.DetailsPanel, Object.assign({ inline: true, layout: o.layout, style: { width: WIDTH[kind], maxWidth: '100%', height: HEIGHT } }, p));
  }

  var STATES = [['own', 'Own'], ['free', 'Free'], ['inws', 'In workspaces'], ['wspage', 'Workspace page'], ['other', 'Other cases'], ['library', 'Not connected'],
    ['shared', 'Shared'], ['blocked', 'Unavailable'], ['plan', 'Not on plan']];
  var NOTE = { own: 'Your own, in no workspace', free: 'Your own, on Free — what a plan brings back is locked', inws: 'Your own, shared in two workspaces',
    wspage: 'Opened on its workspace page, by the Owner', other: 'No metrics and a failed check · a built-in metric · a text preview',
    library: 'A library metric whose source is not connected yet', shared: 'Shared with you by Olena Petrenko',
    blocked: 'Shared with you — unavailable, the owner’s plan lapsed', plan: 'Shared with you — not on your plan' };

  function App() {
    var st = RK.useQueryState('state', 'own'), s = st[0], setS = st[1];
    var ac = RK.useQueryState('actions', 'bottom'), actions = ac[0], setActions = ac[1];
    var ly = RK.useQueryState('layout', 'stacked'), layout = ly[0], setLayout = ly[1];
    var ds = RK.useQueryState('desc', 'short'), desc = ds[0], setDesc = ds[1];
    var rq = R.useState(false), requested = rq[0], setRequested = rq[1];
    var renewal = { blocked: true, owners: ['Olena Petrenko'], requested: requested,
      request: function () { setRequested(true); D.toast.success(h(IK.Fragment, null, 'Email sent to ', h('span', { className: 'font-medium text-ink-primary' }, 'Olena Petrenko')), { description: 'You’ll get access back once the plan is renewed' }); } };
    var o = { actions: actions, layout: layout, desc: desc, renewal: renewal };
    var cols = [['conn', 'Connection · Data Sources', '420px'], ['metric', 'Metric · Metrics', '420px'], ['file', 'File · Files', '448px']];
    return h('div', { className: 'flex min-h-svh flex-col bg-surface-page' },
      h(RK.ReviewBar, { title: 'Details panels', status: 'concept', size: 'sm', autoHeight: true, plan: false, controls: [
        { label: 'State', showLabel: true, value: s, onChange: setS, options: STATES.map(function (x) { return { value: x[0], label: x[1] }; }) },
        { label: 'Actions', showLabel: true, value: actions, onChange: setActions, options: [{ value: 'split', label: 'Split' }, { value: 'top', label: 'Top' }, { value: 'bottom', label: 'Bottom' }] },
        { label: 'Layout', showLabel: true, value: layout, onChange: setLayout, options: [{ value: 'rows', label: 'Rows' }, { value: 'stacked', label: 'Stacked' }, { value: 'cards', label: 'Cards' }] },
        { label: 'Description', showLabel: true, value: desc, onChange: setDesc, options: [{ value: 'short', label: 'Short' }, { value: 'long', label: 'Long' }, { value: 'none', label: 'None' }] }] }),
      h('main', { className: 'flex flex-col gap-4 px-6 py-6' },
        h(D.Typography, { element: 'p', textStyle: 'body14', textColor: 'secondary', className: 'm-0' }, NOTE[s]),
        h('div', { className: 'flex flex-wrap items-start gap-6' }, cols.map(function (c) {
          return h('section', { key: c[0], className: 'flex min-w-0 max-w-full flex-col gap-2' },
            h('div', { className: 'flex items-baseline gap-2' },
              h(D.Typography, { element: 'h2', textStyle: 'label12', textColor: 'secondary', className: 'm-0 uppercase tracking-wider' }, c[1]),
              h(D.Typography, { element: 'span', textStyle: 'body12', textColor: 'secondary', className: 'tabular-nums' }, c[2])),
            h(R.Fragment, { key: s + actions + layout + desc }, build(c[0], s, o)));
        }))),
      h(D.Toaster));
  }
  IK.mount(App);
})();
</script>
</body>
</html>

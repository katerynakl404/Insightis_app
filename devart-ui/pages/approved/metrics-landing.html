<style>
  /* Page layout only. The main column (.cl-main / .cl-page in the original): 36px above the
     title (none below 1024px, where the title row is sticky), 64px below, a 1200px column with
     a 32px gutter (12px on a phone), 12px between blocks. */
  .pg-main { padding: 2.25rem 0 4rem; }
  .pg-page { width: 100%; max-width: 75rem; margin: 0 auto; padding: 0 2rem; display: flex; flex-direction: column; gap: .75rem; }
  @media (max-width: 1023px) { .pg-main { padding-top: 0; } }
  @media (max-width: 767px) { .pg-page { padding: 0 .75rem; } }

  /* Empty state: hero, then "Top 5 Data Sources for" 20px lower, then the card grid. */
  .pg-empty { display: flex; flex-direction: column; gap: .75rem; }
  .pg-cat { display: flex; flex-direction: column; align-items: flex-start; gap: .5rem; margin-top: 1.25rem; }
  .pg-cat-chips { width: 100%; }
  /* phone: the category row scrolls sideways from the column edge */
  @media (max-width: 767px) { .pg-cat-chips { margin: 0 -.75rem; padding-left: .75rem; width: auto; max-width: calc(100% + 1.5rem); } }
  .pg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: .875rem; }

  /* Filled state: 16px between every block. */
  .pg-filled { display: flex; flex-direction: column; gap: 1rem; }
  .pg-toolbar { display: flex; flex-direction: column; gap: 1rem; }
  .pg-filters { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .375rem; }
  .pg-connect { margin-top: 2.25rem; }
  @media (max-width: 767px) { .pg-connect { margin-top: 1.5rem; } }
</style>

    { name: 'REST API', cats: ['Other'], metrics: [
      ['Requests', 'Requests', '@requests_rest', 'rest', 'Total API requests in the selected period.'],
      ['Avg latency', 'Avg latency', '@avg_latency_rest', 'rest', 'Average response time across requests.'],
      ['Error rate', 'Error rate', '@error_rate_rest', 'rest', 'Percentage of requests returning an error.']] },
    { name: 'Airtable', cats: ['Other'], metrics: [
      ['Records created', 'Records created', '@records_created_at', 'airtable', 'Records added to bases.'],
      ['Automations run', 'Automations run', '@automations_run_at', 'airtable', 'Automation triggers fired.'],
      ['Active bases', 'Active bases', '@active_bases_at', 'airtable', 'Bases with activity this period.']] }
  ];

  /* The user's library (the original's #mx-filled-body, row for row). */
  var JIRA = 'Jira Software Cloud';
  var ROWS = [
    { kind: 'group', prov: 'jira', name: JIRA, connector: 'Jira' },
    { kind: 'metric', id: 'custom-1', prov: 'jira', name: 'MRR growth', alias: '@mrr_growth', provider: JIRA, connector: 'Skyvia Jira', custom: true, active: true,
      summary: 'Month-over-month growth rate of MRR derived from Jira billing data.',
      desc: 'Month-over-month growth rate of MRR derived from Jira billing data. Calculated as (MRR this month − MRR last month) ÷ MRR last month × 100. Positive values indicate revenue expansion; negative values signal churn or contraction.' },
    { kind: 'metric', id: 'b-issues_created', prov: 'jira', name: 'Issues created', alias: '@issues_created', provider: JIRA, active: true,
      summary: 'Number of issues created in the selected period.',
      desc: 'Number of issues created in the selected period. Includes all issue types: bugs, tasks, stories, and epics. Does not filter by status or assignee.' },
    { kind: 'metric', id: 'b-issues_resolved', prov: 'jira', name: 'Issues resolved', alias: '@issues_resolved', provider: JIRA, active: true,
      summary: 'Number of issues resolved (closed) in the selected period.',
      desc: 'Number of issues resolved (closed) in the selected period. An issue counts as resolved when its status transitions to Done or a custom closed state. Reopened issues are not subtracted from the total.' },
    { kind: 'metric', id: 'b-sprint_velocity', prov: 'jira', name: 'Sprint velocity', alias: '@sprint_velocity', provider: JIRA, active: true,
      summary: 'Average number of story points completed per sprint.',
      desc: 'Average number of story points completed per sprint. Calculated across all sprints that ended within the selected period. Only counts points from issues in Done status at sprint close.' },
    { kind: 'metric', id: 'b-bug_count', prov: 'jira', name: 'Bug count', alias: '@bug_count', provider: JIRA, active: false,
      summary: 'Number of open bugs at the end of the selected period.',
      desc: 'Number of open bugs at the end of the selected period. Counts issues with issue type Bug that have not been resolved. Provides a snapshot of backlog health at the period boundary.' },
    { kind: 'metric', id: 'b-story_pts_completed', prov: 'jira', name: 'Story points completed', alias: '@story_pts_completed', provider: JIRA, active: true,
      summary: 'Total story points completed across all sprints in the selected period.',
      desc: 'Total story points completed across all sprints in the selected period. Counts only issues in Done status at sprint close. Use alongside Sprint velocity to compare team throughput over time.' },
    { kind: 'conn', id: 'Skyvia Jira', name: 'Skyvia Jira' },
    { kind: 'metric', id: 'custom-skyvia-1', prov: 'jira', conn: 'Skyvia Jira', name: 'Jira ticket sync lag', alias: '@jira_sync_lag', provider: JIRA, connector: 'Skyvia Jira', custom: true, active: true,
      summary: 'Average delay between a Jira issue update and its appearance in Insightis.',
      desc: 'Average delay (in minutes) between a Jira issue update and its appearance in Insightis. Measured via Skyvia Jira connector sync timestamps. Spikes indicate connector throttling or API rate-limit events.' },
    { kind: 'group', prov: 'azure', name: 'Azure DevOps' },
    { kind: 'empty', prov: 'azure', name: 'Azure DevOps' },
    { kind: 'group', prov: 'github', name: 'GitHub' },
    { kind: 'metric', id: 'b-prs_opened', prov: 'github', name: 'Pull requests opened', alias: '@prs_opened', provider: 'GitHub', active: true,
      summary: 'Number of pull requests opened in the selected period.',
      desc: 'Number of pull requests opened in the selected period. Includes PRs targeting any branch, not just the default branch. Draft pull requests are excluded from the count.' },
    { kind: 'metric', id: 'b-prs_merged', prov: 'github', name: 'Pull requests merged', alias: '@prs_merged', provider: 'GitHub', active: true,
      summary: 'Number of pull requests merged into the main branch in the selected period.',
      desc: "Number of pull requests merged into the main branch in the selected period. Only counts merges into the repository's default branch. PRs closed without merging are not included." },
    { kind: 'metric', id: 'b-commits_per_day', prov: 'github', name: 'Commits per day', alias: '@commits_per_day', provider: 'GitHub', active: false,
      summary: 'Average number of commits pushed per calendar day in the selected period.',
      desc: 'Average number of commits pushed per calendar day in the selected period. Counts commits across all branches; merge commits are included. Weekends and holidays are not excluded from the daily average.' },
    { kind: 'metric', id: 'b-code_review_time', prov: 'github', name: 'Code review time', alias: '@code_review_time', provider: 'GitHub', active: true,
      summary: 'Average time from pull request creation to first review comment.',
      desc: 'Average time from pull request creation to first review comment. Measured in hours across all PRs that received at least one review in the selected period. PRs with no review comments are excluded from the calculation.' },
    { kind: 'metric', id: 'b-issues_closed', prov: 'github', name: 'Issues closed', alias: '@issues_closed', provider: 'GitHub', active: false,
      summary: 'Number of GitHub issues closed in the selected period.',
      desc: 'Number of GitHub issues closed in the selected period. Counts issues whose state changed to closed, including those auto-closed by a linked pull request. Issues that were reopened and closed again within the same period are counted once.' }
  ];
  var CONNECTIONS = [{ id: 'Skyvia Jira', label: 'Skyvia Jira (Jira Software Cloud)' }];
  var CATALOG = 'approved/data-sources_connections-landing.html';

  function go(rel) { location.href = IK.pageHref(rel); }
  function norm(v) { return (v || '').trim().toLowerCase(); }

  function App() {
    var stQ = IK.useQueryState('state', 'empty'), state = stQ[0], setState = stQ[1];
    var plan = IK.usePlan()[0], free = plan === 'free';

    var rs = R.useState(ROWS), rows = rs[0], setRows = rs[1];
    var cs = R.useState(CATS[0]), cat = cs[0], setCat = cs[1];
    var qs = R.useState(''), query = qs[0], setQuery = qs[1];
    var ts = R.useState('all'), type = ts[0], setType = ts[1];
    var as = R.useState(false), activeOnly = as[0], setActiveOnly = as[1];
    var ap = R.useState(false), applied = ap[0], setApplied = ap[1];   /* any filter touched yet */
    var cl = R.useState({}), collapsed = cl[0], setCollapsed = cl[1];
    var ds1 = R.useState(false), u4Gone = ds1[0], setU4Gone = ds1[1];
    var ds2 = R.useState(false), moreGone = ds2[0], setMoreGone = ds2[1];
    /* the details sheet: a library chip (metric) or one of the user's rows (rowId) */
    var ss = R.useState({ open: false }), sheet = ss[0], setSheet = ss[1];
    var cd = R.useState({ open: false, source: '' }), conn = cd[0], setConn = cd[1];
    var md = R.useState({ open: false }), dlg = md[0], setDlg = md[1];
    var counter = R.useRef(2);

    var filled = state === 'filled';
    function changeState(v) { setSheet(function (s) { return Object.assign({}, s, { open: false }); }); setState(v); }

    /* ── rows ── */
    function rowById(id) { for (var i = 0; i < rows.length; i++) if (rows[i].id === id && rows[i].kind === 'metric') return rows[i]; return null; }
    function patch(id, o) { setRows(function (list) { return list.map(function (r) { return r.kind === 'metric' && r.id === id ? Object.assign({}, r, o) : r; }); }); }
    function remove(id) { setRows(function (list) { return list.filter(function (r) { return !(r.kind === 'metric' && r.id === id); }); }); }
    function duplicate(src) {
      var alias = (src.alias || '').replace(/^@/, '') + '_copy';
      var copy = {
        kind: 'metric', id: 'custom-' + (counter.current++), prov: src.prov, conn: src.conn,
        name: src.name + ' (Copy)', alias: alias ? '@' + alias : '', provider: src.provider,
        connector: src.connector || src.provider, desc: src.desc, summary: src.desc, custom: true, active: false
      };
      setRows(function (list) {
        var i = list.indexOf(list.filter(function (r) { return r.kind === 'metric' && r.id === src.id; })[0]);
        var next = list.slice(); next.splice(i + 1, 0, copy); return next;
      });
      setState('filled');
    }
    function findDuplicates(name, alias) {
      var hit = { name: null, alias: null }, n = norm(name), a = norm(alias).replace(/^@/, '');
      rows.forEach(function (r) {
        if (r.kind !== 'metric' || (dlg.editId && r.id === dlg.editId)) return;
        if (n && norm(r.name) === n) hit.name = r.name;
        if (a && norm(r.alias).replace(/^@/, '') === a) hit.alias = r.alias;
      });
      return hit;
    }
    function saveMetric(v) {
      if (dlg.mode === 'edit') {
        patch(dlg.editId, { name: v.name, alias: v.alias, desc: v.def, summary: v.def, connector: v.connector, provider: v.connector || 'Custom' });
        return;
      }
      setRows(function (list) {
        return list.concat([{ kind: 'metric', id: 'custom-' + (counter.current++), prov: 'custom', name: v.name, alias: v.alias,
          provider: v.connector || 'Custom', connector: v.connector, desc: v.def, summary: v.def, custom: true, active: false }]);
      });
      setState('filled');
    }

    /* ── surfaces ── */
    function openRow(r) { setSheet({ open: true, rowId: r.id }); }
    function openChip(card, m) {
      setSheet({ open: true, metric: { kind: 'library', name: m[1], alias: m[2], prov: m[3], desc: m[4], provider: card.name, logo: card.connector } });
    }
    function openCreate() { setDlg({ open: true, mode: 'create', initial: {} }); }
    function openEdit(r) {
      setSheet(function (s) { return Object.assign({}, s, { open: false }); });
      setDlg({ open: true, mode: 'edit', editId: r.id, initial: { name: r.name, alias: (r.alias || '').replace(/^@/, ''), def: r.desc, connector: r.connector || '' } });
    }
    function openConnect(source) { setConn({ open: true, source: source }); }
    function connected(label) {
      D.toast.success(h(IK.Fragment, null, h('strong', null, label), ' connected successfully'), { id: 'mx-conn' });
      setState('filled');
    }

    var sheetRow = sheet.rowId ? rowById(sheet.rowId) : null;
    var sheetMetric = sheetRow ? Object.assign({}, sheetRow, { kind: sheetRow.custom ? 'custom' : 'builtin' }) : sheet.metric;
    var sheetOpen = sheet.open && !!sheetMetric;

    var f = IK.mxFilterMetrics(rows, { query: query, type: type, activeOnly: activeOnly, applied: applied });

    /* ── empty state ── */
    var shown = CARDS.filter(function (c) { return c.cats.indexOf(cat) >= 0; }).slice(0, 5);
    var empty = h('div', { className: 'pg-empty' },
      h(D.Banner, {
        variant: 'horizontalWide', role: 'note',
        icon: h(IK.Icon, { name: 'pg-sun' }),
        title: 'Explore your metrics library',
        description: free
          ? 'Browse 50+ ready-made metrics for free. To see your own numbers in them, connect a source — that starts on Starter.'
          : '50+ built-in metrics across popular data sources. Browse below to explore definitions — connect a source to activate any metric.',
        action: h(D.Button, { variant: 'secondary', size: 'sm', type: 'button', onClick: function () { go(CATALOG); } }, 'Create Connection')
      }),
      h('div', { className: 'pg-cat' },
        h(D.Typography, { element: 'span', textStyle: 'title20', textColor: 'primary', className: 'whitespace-nowrap' }, 'Top 5 Data Sources for'),
        h(D.ScrollShadow, { orientation: 'horizontal', className: 'pg-cat-chips' },
          h(D.FilterChips, { value: cat, onValueChange: function (v) { if (v) setCat(v); }, size: 'sm', 'aria-label': 'Data source category', className: 'gap-1.5 max-md:flex-nowrap' },
            CATS.map(function (c) { return h(D.FilterChip, { key: c, value: c, size: 'sm' }, c); })))),
      h('div', { className: 'pg-grid' },
        shown.map(function (c) {
          return h(IK.MxProviderCard, {
            key: c.name, name: c.name, connector: c.connector,
            metrics: c.metrics.map(function (m) { return { label: m[0], m: m }; }),
            onMetric: function (x) { openChip(c, x.m); },
            onConnect: function () { openConnect(c.name); }
          });
        }),
        h(IK.MxBrowseCard, {
          label: 'Explore more ' + cat + ' data sources', sub: '200+ integrations available to connect',
          onClick: function () { go(CATALOG + '?cat=' + encodeURIComponent(cat)); }
        })));

    /* ── filled state ── */
    var filledView = h('div', { className: 'pg-filled' },
      free && !u4Gone ? h(D.Alert, {
        variant: 'warning', size: 'md', role: 'note', className: 'max-sm:flex-wrap',
        icon: h(IK.Icon, { name: 'metrics' }),
        title: 'Your subscription ended, so these metrics can no longer be edited',
        description: h(IK.Fragment, null, 'Nothing was deleted. ',
          h(IK.Locked, { feature: 'metrics', clickOnly: true, marker: 'none' },
            h(D.LinkButton, { href: '#', onClick: function (e) { e.preventDefault(); } }, 'Upgrade to Starter')),
          ' to edit them and ask about them in chat.'),
        actions: h(IK.Tip, { tip: 'Dismiss' },
          h(D.IconButton, { variant: 'tertiary', size: '2xs', type: 'button', 'aria-label': 'Dismiss', onClick: function () { setU4Gone(true); } }, h(IK.Icon, { name: 'pg-x' })))
      }) : null,
      h('div', { className: 'pg-toolbar' },
        h(D.InputGroup, { size: 'lg', role: 'search' },
          h(D.InputGroupAddon, { align: 'inline-start' }, h(IK.Icon, { name: 'pg-search' })),
          h(D.InputGroupInput, { type: 'search', placeholder: 'Search metrics...', value: query, onChange: function (e) { setApplied(true); setQuery(e.target.value); } }),
          query ? h(IK.Tip, { tip: 'Clear search' },
            h(D.InputGroupAction, { 'aria-label': 'Clear search', onClick: function () { setApplied(true); setQuery(''); } }, h(IK.Icon, { name: 'mx-x' }))) : null),
        h('div', { className: 'pg-filters' },
          h(D.FilterChips, { value: type, onValueChange: function (v) { setApplied(true); if (v) setType(v); }, size: 'sm', 'aria-label': 'Metric type', className: 'gap-1.5' },
            [['all', 'All'], ['builtin', 'Built-in'], ['custom', 'Custom']].map(function (t) {
              return h(D.FilterChip, {
                key: t[0], value: t[0], size: 'sm',
                /* pressing the active Built-in / Custom chip goes back to All */
                onClick: function () { setApplied(true); if (t[0] !== 'all' && type === t[0]) setType('all'); }
              }, t[1]);
            })),
          h(D.Switch, { size: 'sm', label: 'Active only', labelPosition: 'left', gap: 'sm', className: 'ms-auto', checked: activeOnly, onCheckedChange: function (v) { setApplied(true); setActiveOnly(v); } }))),
      f.any
        ? h(IK.MxMetricsTable, {
            rows: rows, hidden: f.hidden, collapsed: collapsed,
            onToggleGroup: function (prov) { setCollapsed(function (c) { var n = Object.assign({}, c); n[prov] = !n[prov]; return n; }); },
            selected: sheetOpen && sheet.rowId,
            onOpen: openRow,
            onActive: function (r, on) { patch(r.id, { active: on }); },
            onAdd: openCreate, onEdit: openEdit,
            onDuplicate: duplicate,
            onDelete: function (r) { remove(r.id); }
          })
        : h(D.StatusView, {
            size: 'lg', surface: 'embedded', role: 'status', withIconHalo: false,
            icon: h(D.EmptyStateIllustration),
            title: 'No matches found',
            description: 'No metrics match your search or filters — try a different term or clear them'
          }),
      !free && !moreGone ? h('div', { className: 'pg-connect' },
        h(D.Banner, {
          variant: 'horizontalWide', size: 'sm', role: 'note',
          icon: h(IK.Icon, { name: 'pg-plug' }),
          title: 'Connect more data sources',
          description: '50+ data sources available — add connections to unlock more built-in metrics for your library.',
          action: h(D.Button, { variant: 'secondary', size: 'sm', type: 'button', onClick: function () { go(CATALOG); } }, 'Browse Data Sources'),
          onDismiss: function () { setMoreGone(true); }
        })) : null);

    return h(IK.Fragment, null,
      h(IK.ReviewBar, { title: 'Metrics', status: 'approved', plan: true, size: 'sm', controls: [
        { label: 'Demo state', value: state, onChange: changeState,
          options: [{ value: 'empty', label: 'Empty' }, { value: 'filled', label: 'Filled' }] }] }),
      h(IK.AppShell, { nav: 'metrics', burger: false },
        h('div', { className: 'pg-main' },
          h('div', { className: 'pg-page' },
            h(IK.MxPageHead, {
              title: 'Metrics',
              actions: filled ? h(IK.Locked, { feature: 'metrics', surface: 'modal' },
                h(D.Button, { variant: 'primary', size: 'sm', rounded: 'full', type: 'button', leftSlot: h(IK.Icon, { name: 'pg-plus' }), onClick: openCreate }, 'Create Metric')) : null
            }),
            filled ? filledView : empty))),
      h(IK.MxMetricSheet, {
        open: sheetOpen, metric: sheetMetric || {},
        onOpenChange: function (v) { setSheet(function (s) { return Object.assign({}, s, { open: v }); }); },
        onActive: function (on) { if (sheetRow) patch(sheetRow.id, { active: on }); },
        onConnect: function () { setSheet({ open: false }); openConnect(sheetMetric.prov); },
        onDuplicate: function () { setSheet({ open: false }); if (sheetRow) duplicate(sheetRow); },
        onEdit: function () { if (sheetRow) openEdit(sheetRow); },
        onDelete: function () { if (sheetRow) remove(sheetRow.id); setSheet({ open: false }); }
      }),
      h(IK.MxConnectDialog, {
        open: conn.open, source: conn.source,
        onOpenChange: function (v) { setConn(function (c) { return Object.assign({}, c, { open: v }); }); },
        onCreate: connected
      }),
      h(IK.MxMetricDialog, {
        open: !!dlg.open, mode: dlg.mode, initial: dlg.initial, options: CONNECTIONS,
        findDuplicates: findDuplicates, onSave: saveMetric,
        onOpenChange: function (v) { setDlg(function (d) { return Object.assign({}, d, { open: v }); }); }
      }),
      h(D.Toaster));
  }
  IK.mount(App);
})();
</script>
</body>
</html>

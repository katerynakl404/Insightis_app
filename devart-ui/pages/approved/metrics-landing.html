    f = IK.mxFilterSource(allRows, srcValid ? provF : 'all', f);
    /* Rows: the Favorites chip leaves only the starred ones, in their groups */
    var favOn = rowsView && favOnly && favCount > 0;
    if (favOn) f = IK.mxFilterFavorites(allRows, favs, f);
    /* a DevartUI Toggle as a chip, the filter pills' 28px; there once something is starred (nothing to filter before) */
    var favChip = rowsView && favCount ? h(D.Toggle, { variant: 'stroke', size: 'xs', rounded: 'full', pressed: favOn, 'aria-label': 'Favorites only',

    /* ── empty state ── */
    var shown = CARDS.filter(function (c) { return c.cats.indexOf(cat) >= 0; }).slice(0, 5);
    var empty = h('div', { className: 'pg-empty' },
      h(D.Banner, {
        variant: 'horizontalWide', role: 'note',
        icon: h(IK.Icon, { name: 'pg-sun' }),
        title: 'Explore your metrics library',
        description: free

        action: h(D.Button, { variant: 'secondary', size: 'sm', type: 'button', onClick: function () { go(CATALOG); } }, 'Create Connection')
      }),
      h('div', { className: 'pg-cat' },
        h(D.Typography, { element: 'span', textStyle: 'title20', textColor: 'primary', className: 'whitespace-nowrap' }, 'Top 5 Data Sources for'),

        h('div', { className: 'pg-cat-chips' },
          h(D.FilterChips, {

      h('div', { className: 'pg-grid' },
        shown.map(function (c) {

    /* ── filled state ── */
    var filledView = h('div', { className: 'pg-filled' },
      /* the notices as one stack: the plan's own first, then what was shared (user, 2026-10-19) */
      (function () {
        var u4 = free && filled && !u4Gone ? h(D.Alert, {
          key: 'u4',
        /* the × stays on the first line on a phone (DevartUI lays actions full width there) */
        variant: 'warning', size: 'md', role: 'note', actionsClassName: 'max-sm:w-auto',
        /* a subscription, not a fault: the wallet illustration, as on Data Sources (user, 2026-10-21: "мав бути банер з гарною ілюстрацією про підписку з гаманцем") — DevartUI Alert's illustration:
                   the wallet on a plate in the alert's own tone */
        illustration: h(IK.Icon, { name: 'wallet', size: 20 }),
        title: 'Your subscription ended, so these metrics can no longer be edited',
        description: h(IK.Fragment, null, 'Nothing was deleted. ',
          h(IK.Locked, { feature: 'metrics', clickOnly: true, marker: 'none' },
            h(D.LinkButton, { href: '#', onClick: function (e) { e.preventDefault(); } }, 'Upgrade to Starter')),
          /* with shared ones in the list, the same notice covers them (no second "Upgrade to Starter") */
          inList ? ' to edit them and ask about them in chat, the ones shared with you included.' : ' to edit them and ask about them in chat.'),
        actions: h(IK.Tip, { tip: 'Dismiss' },
          h(D.IconButton, { variant: 'tertiary', size: '2xs', type: 'button', 'aria-label': 'Dismiss', onClick: function () { setU4Gone(true); } }, h(IK.Icon, { name: 'pg-x' })))
      }) : null;
        /* the invitation first: something shared waits for Accept (user, 2026-10-20) */
        /* on a list only the invitation that waits for Accept; the others (another address, expired, unavailable)
                   come after the sign-in, on the chat (rule 15; user, 2026-10-20) */
        /* no invitation here (user, 2026-10-20) — it shows on the chat and the Workspaces list */
        return inList ? h(IK.WsSharedNotices, { ws: ws, free: free, trial: wsq.trial, module: 'Metrics', feature: 'metrics', before: [u4], planCovered: free && filled })
          : u4;
      })(),
      h('div', { className: 'pg-toolbar' },
        /* DevartUI SearchInput (user, 2026-10-22: "треба по максимуму з деварт юа") */
        h(D.SearchInput, { value: query, placeholder: 'Search metrics...', 'aria-label': 'Search metrics',
          onValueChange: function (v) { setApplied(true); setQuery(v); }, onClear: function () { setApplied(true); setQuery(''); } }),
        h('div', { className: 'pg-filters' },
          /* FilterChips' root is w-full: the wrapper keeps the chips and "Active only" on one row */
          /* Shared: Owner — two filters as pills, Type and Owner, where the chips are (user, 2026-10-19) */
          h('div', { className: 'flex min-w-0 flex-1 flex-wrap items-center gap-2' },
            h(D.FilterMenu, { label: 'Type', value: type, onValueChange: function (v) { setApplied(true); setType(v); },
              options: [{ value: 'all', label: 'All' }, { value: 'builtin', label: 'Built-in' }, { value: 'custom', label: 'Custom' }] }),
            inList ? h(D.FilterMenu, { label: 'Owner', value: ownerF, onValueChange: function (v) { setApplied(true); setOwnerF(v); }, options: IK.wsOwnerOptions({ me: filled ? rows.filter(function (r) { return r.kind === 'metric'; }).length : 0, shared: sharedRows.filter(function (r) { return r.kind === 'metric'; }).length }) }) : null,
            provPill, favChip,
            h(IK.WsClearFilters, { show: [type !== 'all', ownerF !== 'any', provF !== 'all', favOn].filter(Boolean).length > 1,
              onClear: function () { setApplied(true); setType('all'); setOwnerF('any'); setProvF('all'); setFavOnly(false); } })),
          h('div', { className: 'ms-auto flex flex-none items-center gap-4' },
            /* shared metrics are always on — only their owner turns them off — so with only shared ones in view the switch
               has nothing to filter: disabled, saying why, and back as soon as one's own are in view (user, 2026-10-19:
               'пошерені тільки активні?'); disabled, not hidden, so the row doesn't jump */
            (function () {
              var onlyShared = ownerF === 'shared';
              var sw = h(D.Switch, { size: 'sm', label: 'Active only', labelPosition: 'left', gap: 'sm', disabled: onlyShared, checked: activeOnly && !onlyShared, onCheckedChange: function (v) { setApplied(true); setActiveOnly(v); } });
              return onlyShared ? h(IK.Tip, { tip: 'Shared metrics are always active — their owner turns them on or off', wrap: true }, h('span', { className: 'inline-flex' }, sw)) : sw;
            })(),
            null))),
      f.any
        ? h(rowsView ? IK.MxMetricList : IK.MxMetricsTable, {
            rows: allRows, hidden: f.hidden, collapsed: collapsed,
            /* Rows: the star on each row; the Favorites chip leaves only them (no section on top — user, 2026-10-21) */
            favorites: rowsView ? favs : undefined, onFavorite: star,
            onToggleGroup: touring ? function () {} : function (prov) { setCollapsed(function (c) { var n = Object.assign({}, c); n[prov] = !n[prov]; return n; }); },
            /* a shared metric open in the sheet is the selected row too (it has no rowId, its id is on the metric) */
            selected: sheetOpen && (sheet.rowId || (sheet.metric && sheet.metric.id)),
            onOpen: touring ? null : openRow,
            onActive: function (r, on) { patch(r.id, { active: on }); },
            onAdd: touring ? null : openCreate, onEdit: openEdit,
            onDuplicate: duplicate,
            onDelete: function (r) { del.ask(r, function () { remove(r.id); }); }
          })
        : h(D.StatusView, {
            size: 'lg', surface: 'embedded', role: 'status', withIconHalo: false,
            icon: h(D.EmptyStateIllustration),
            title: 'No matches found',
            description: 'No metrics match your search or filters — try a different term or clear them'
          }),
      !free && !moreGone ? h('div', { className: 'pg-connect' },
        h(D.Banner, {
          variant: 'horizontalWide', size: 'sm', role: 'note',
          icon: h(IK.Icon, { name: 'pg-plug' }),
          title: 'Connect more data sources',
          description: '50+ data sources available — add connections to unlock more built-in metrics for your library.',
          action: h(D.Button, { variant: 'secondary', size: 'sm', type: 'button', onClick: function () { go(CATALOG); } }, 'Browse Data Sources'),
          onDismiss: function () { setMoreGone(true); }
        })) : null);

    return h(IK.Fragment, null,
      /* onboarding mode: no Plan (the free trial) and no Demo state (the library of the source just connected) */
      h(RK.ReviewBar, { title: 'Metrics', status: 'approved', plan: !onbQ[0] && !RK.wsOwnsPlan(wsq), size: 'sm', controls: [
        onbQ[0] ? null : { label: 'Demo state', value: state, onChange: changeState,
          options: [{ value: 'empty', label: 'Empty' }, { value: 'filled', label: 'Filled' }] },
        onbQ[0] ? null : { label: 'List', showLabel: true, value: listQ[0], onChange: function (v) { listQ[1](v); setFavOnly(false); }, options: [{ value: 'table', label: 'Table' }, { value: 'rows', label: 'Rows' }] },
        /* Favorites only where it acts: with Rows */
        onbQ[0] || !rowsView ? null : { label: 'Favorites', showLabel: true, value: favQ[0], onChange: setFavState, options: [{ value: 'some', label: 'Some' }, { value: 'none', label: 'None' }] }].concat(onbQ[0] ? RK.onboardingControls({ here: 'metrics', step: onbQ[0] }) : RK.workspaceControls({ here: 'metrics' })) }),
      h(IK.AppShell, { nav: 'metrics', burger: false, scroll: false, brandLink: false, accountIcons: 'classic', workspaces: wsOn ? ws : null, trialDays: wsOn && wsq.trial && IK.getPlan() !== 'free' ? 3 : undefined },
        h(IK.ListPage, {
            title: 'Metrics', wrap: true,
            actions: showList ? h(IK.Locked, { feature: 'metrics', surface: 'modal' },
              h(D.Button, { variant: 'primary', size: 'sm', rounded: 'full', type: 'button', leftSlot: h(IK.Icon, { name: 'pg-plus' }), onClick: openCreate }, 'Create Metric')) : null
          },
          showList ? filledView : empty)),
      (function () {
        var m = sheetOpen && sheetMetric && sheetMetric.name ? sheetMetric : null;
        return h(IK.MetricDetails, { metric: m,
          onOpenChange: function (v) { setSheet(function (s) { return Object.assign({}, s, { open: v }); }); },
            free: free,
            renewal: m && m.readOnly && m.ws ? IK.wsRenewal(ws, [m.ws.id]) : null,
            /* one's own: Workspaces always — it goes with its connection (its name opens the connection's details), where that is */
            workspaces: wsOn, shareLocked: free,
            onOpenConnection: wsOn && sheetRow ? function () { setConnPrev(connOf(sheetRow)); } : undefined,
            onActive: function (on) { if (sheetRow) patch(sheetRow.id, { active: on }); },
            onConnect: function () { closeSheet(); openConnect(m && m.prov); },
            onDuplicate: function () { closeSheet(); if (sheetRow) duplicate(sheetRow); },
            onEdit: function () { if (sheetRow) openEdit(sheetRow); },
            onDelete: function () { var r = sheetRow; if (!r) return; closeSheet(); del.ask(r, function () { remove(r.id); }); } });
      })(),
      /* the connection's details over the metric's, whole, as on Data Sources: what it is, its last check, where it is shared
         (Share via Workspace, taking it out of one), Add Metric, Edit · Test Connection · Disconnect */
      wsOn ? (function () {
          var c = connPrev ? Object.assign({}, connPrev, cx[connPrev.id]) : null;
          var w = c ? IK.wsWhereShared(ws.list, c.id) : [];
          return h(IK.ConnectionDetails, { connection: c ? Object.assign({}, c, { sharedWith: w.map(function (x) { return x.name; }), links: IK.wsLinks(w) }) : null,
            onOpenChange: function (o) { if (!o) setConnPrev(null); },
            free: free, wsLocked: free,
            onEdit: function () { setEditC(c); },
            onTest: function () { connTest(c); },
            onDetails: function () { IK.wsToast.checkFailed(c); },
            onDisconnect: function () { setDiscC(c); },
            onAddMetric: function () { setDlg({ open: true, mode: 'create', initial: { connector: c.label, link: 'connection' } }); },
            /* its metrics: here, the Provider filter on it (a sub-header of that name, or the source it is) */
            onMetrics: function () {
              var t = IK.mxSourceTree(allRows), v = null;
              t.forEach(function (g) { g.children.forEach(function (k) { if (!v && k.label === c.label) v = k.value; }); if (!v && g.label === c.label) v = g.value; });
              setApplied(true); setProvF(v || 'all'); setConnPrev(null); closeSheet();
            },
            onAddToWorkspace: function () { setShareFor(c); },
            onRemoveFromWorkspace: function (it) {
              rm.ask({ kind: 'connection', name: c.label, metrics: c.metrics, wsName: it.name, run: function () { ws.removeConnection(it.id, c.id); } });
            } });
      })() : null,
      rm.dialog,
      del.dialog,
      wsOn ? h(IK.DsEditConnectionDialog, {
        open: !!editC, label: editC && editC.label, desc: editC && (editC.desc || ''),
        onOpenChange: function (o) { if (!o) setEditC(null); },
        onSave: function (v) { var c = editC; setEditC(null); connRename(c, v); }
      }) : null,
      wsOn ? h(IK.DsDisconnectDialog, {
        open: !!discC, label: discC && discC.label,
        sharedIn: discC ? IK.wsWhereShared(ws.list, discC.id).map(function (x) { return x.name; }) : [],
        onOpenChange: function (o) { if (!o) setDiscC(null); },
        onConfirm: function () { var c = discC; setDiscC(null); connRemove(c); }
      }) : null,
      wsOn ? h(IK.WsAddToWorkspacesDialog, {
        open: !!shareFor, onOpenChange: function (o) { if (!o) setShareFor(null); }, connection: shareFor, workspaces: ws.owned, createLocked: free,
        taken: function (n) { return IK.wsNameTaken(ws.list, n); }, onCreate: function (n, d) { return ws.create(n, d); },
        onAdd: function (ids) {
          var c = shareFor;
          ids.forEach(function (id) { ws.addConnections(id, [c]); });
          setShareFor(null);
          IK.wsToast.added(ws, ids, { kind: 'connection', name: c.label, metrics: c.metrics });
        } }) : null,
      h(IK.ConnectDialog, {
        open: conn.open, connector: conn.source || 'New Connection', mark: 'letter',
        onOpenChange: function (v) { setConn(function (c) { return Object.assign({}, c, { open: v }); }); },
        onCreate: function (r) { connected(r.label); }
      }),
      h(IK.MxMetricDialog, {
        /* the person's connections from Data Sources too, with workspaces on (they are in the library) */
        open: !!dlg.open, mode: dlg.mode, initial: dlg.initial,
        options: CONNECTIONS.concat(wsOn ? IK.WS_CONNECTIONS.map(function (c) { return { id: c.label, label: c.label + ' (' + c.name + ')' }; }) : []),
        findDuplicates: findDuplicates, onSave: saveMetric, sharedAlias: wsOn ? sharedAlias : undefined,
        onOpenChange: function (v) { setDlg(function (d) { return Object.assign({}, d, { open: v }); }); }
      }),
      touring ? h(IK.OnbTour, {
        open: !leaving, step: 'metrics', path: 'conn', source: onbSrc, group: onbSrc.id,
        metricCount: rows.filter(function (r) { return r.kind === 'metric' && r.prov === onbSrc.id; }).length,
        onStep: function (id) { location.assign(IK.onbHref(id, oq)); },
        onClose: endTour
      }) : null,
      h(D.Toaster));
  }
  IK.mount(App);
})();

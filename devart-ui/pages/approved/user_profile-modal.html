<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insightis · Account modal</title>
<link rel="stylesheet" href="../../../ds-bundle/styles.css">
<link rel="stylesheet" href="../../insightis-kit/insightis-kit.css">
<script src="../../../ds-bundle/_vendor/react.js"></script>
<script src="../../../ds-bundle/_ds_bundle.js"></script>
<script src="../../insightis-kit/insightis-kit.js"></script>
<style>
  /* Page layout only. The plan grid goes 2-over-1 between 768 and 1024px (the original's own
     range, 1024 included) and one column below 768px. */
  @media (max-width: 1024px) and (min-width: 768px) { .pg-plan-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 767px) { .pg-plan-grid { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* Account settings window — rebuilt from pages/approved/user_profile-modal.html on IK.AcctModal and
   its sections (AcctSettings / AcctBalance / AcctPlans). Opens on ?section= (my-account,
   manage-plan, billing, balance, leave-feedback, change-password), Balance when absent — the
   account popover on every page links here. Locked rules: page-changes/user_profile-modal.md.

   Review switches, as in the original topbar: Plan (Paid / Free — shared with every page),
   Plan state (Balance's credit figures: Free / Trial / Pro (trial) / Limit reached) and Daily limit
   bar (on / off), both Balance-only. Like the original, "Plan state" disappears for good once a
   non-Balance section has been opened (its applyPlanState() never un-hides it); "Daily" comes back.

   Manage plan follows the Plan switch: on Free the strip reads "Free" with nothing to expire or
   cancel, Free is the current card and Starter offers the upgrade. The Starter CTA is driven by two
   events in order, exactly like the original's DOM: the plan (Upgrade to Starter / Current Plan)
   and the billing period (Request Yearly Billing / Current Plan). An upgrade CTA stands in for the
   whole payment: the plan flips to Paid everywhere and a toast says which plan and what it opened. */
(function () {
  var IK = window.InsightisKit, D = window.DevartUI, R = window.React, h = IK.h;

  /* ORIGINAL QUIRK, reproduced (rule 1a): the three plan dialogs (Cancel plan, Switch to Free,
     yearly-billing request) never appear in the original — each overlay carries an inline
     display:none that its open handler (which only flips `hidden`) never clears. The triggers
     still "open" them: the invisible dialog swallows the next Esc, Request Yearly Billing still
     upgrades + toasts. The dialogs are built (IK.AcctConfirmDialog / IK.AcctYearlyDialog, see the
     storybook); true here shows them as page-changes/user_profile-modal.md describes. */
  var SHOW_PLAN_DIALOGS = false;

  var START = (function () {
    var s = new URLSearchParams(location.search).get('section');
    return IK.ACCT_SECTIONS.indexOf(s) >= 0 ? s : 'balance';
  })();

  /* ── Seed data — every figure is the original's ───────────────────────────────────────── */
  var BALANCE = {
    free: { badges: [{ label: 'Free plan' }], wrap: false, amount: '827',
      sub: { left: '287 left', meta: '213 of 500 used', pct: 42.6, label: 'Subscription: 213 of 500 credits used, 287 left' },
      daily: { left: '18 left', meta: '32 of 50 used', pct: 64, label: 'Daily limit: 32 of 50 credits used, 18 left' },
      purchased: '540 left' },
    trial: { badges: [{ label: 'Trial' }, { label: 'Trial ends in 14 days', variant: 'attention' }], amount: '14,999.9',
      sub: { left: '14,999.9 left', meta: '0.023 of 15,000 used', pct: 0.15, label: 'Subscription: 0.023 of 15,000 credits used, 14,999.9 left' },
      daily: { left: '1,499.9 left', meta: '0.023 of 1,500 used', pct: 0.15, label: 'Daily limit: 0.023 of 1,500 credits used, 1,499.9 left' },
      purchased: '0 left', noPacks: true },
    pro: { badges: [{ label: 'Pro plan' }, { label: 'Trial ends in 14 days', variant: 'attention' }], amount: '6,800',
      sub: { left: '6,800 left', meta: '3,200 of 10,000 used', pct: 32, label: 'Subscription: 3,200 of 10,000 credits used, 6,800 left' },
      daily: { left: '580 left', meta: '420 of 1,000 used', pct: 42, label: 'Daily limit: 420 of 1,000 credits used, 580 left' },
      purchased: '0 left' },
    exhausted: { badges: [{ label: 'Free plan' }], amount: '0',
      sub: { left: '0 left', meta: '500 of 500 used · Resets Aug 1, 2026', pct: 100, label: 'Subscription: 500 of 500 credits used, 0 left, resets Aug 1, 2026' },
      daily: { left: '0 left', meta: '50 of 50 used · Resets at 12:00 AM', pct: 100, label: 'Daily limit: 50 of 50 credits used, 0 left, resets at 12:00 AM' },
      purchased: '0 left' }
  };
  var USAGE = [['Jan 29, 2026', 'Chat', '15'], ['Jan 29, 2026', 'Report', '20'], ['Jan 5, 2026', 'Chat', '3'],
    ['Dec 5, 2025', 'Report', '5'], ['Nov 5, 2025', 'Chat', '16'], ['Oct 5, 2025', 'Insight', '4'], ['Sep 5, 2025', 'Insight', '50']];
  var INVOICES = [['Aug 30, 2026', 'Starter — monthly', '$7.99'], ['Jul 30, 2026', 'Starter — monthly', '$7.99'],
    ['Jun 30, 2026', 'Starter — monthly', '$7.99'], ['May 30, 2026', 'Credit pack — 5,000', '$9.99'],
    ['May 30, 2026', 'Starter — monthly', '$7.99']];
  var STARTER_FEATS = ['Up to 5 users', '5,000 AI credits / month', 'Unlimited data connectors', '1-hour data refresh', 'Custom semantic layer', 'Priority email support'];
  var PRICES = {
    monthly: { period: 'Monthly', starter: ['$7.99', '$19.99'], pro: ['$15.99', '$39.99'] },
    yearly: { period: 'Yearly', starter: ['$71.88', '$143.88'], pro: ['$143.88', '$287.88'] }
  };

  /* ── The two plan CTAs the original mutates in place (acctApplyPlan / acctSyncCurrentPlanCta) */
  function ctaInit(free) { return ctaReduce({ starter: { label: 'Current Plan', disabled: true, variant: 'outline', yearly: false } }, { type: 'plan', free: free }); }
  function ctaReduce(s, a) {
    var st = Object.assign({}, s.starter);
    if (a.type === 'plan') {
      st.label = a.free ? 'Upgrade to Starter' : 'Current Plan';
      st.disabled = !a.free; st.variant = a.free ? 'primary' : 'outline';
      return { starter: st, free: { label: a.free ? 'Current Plan' : 'Switch to Free', disabled: a.free } };
    }
    if (a.type === 'period') {
      var y = a.period === 'yearly';
      st.label = y ? 'Request Yearly Billing' : 'Current Plan'; st.disabled = !y; st.yearly = y;
      return { starter: st, free: s.free };
    }
    return s;
  }

  function App() {
    var plan = IK.usePlan()[0];
    var free = plan === 'free';
    var sec = R.useState(START), section = sec[0], setSection = sec[1];
    /* The original's #plan-toggle, once hidden by a non-Balance section, never comes back. */
    var gone = R.useRef(START !== 'balance');
    if (section !== 'balance') gone.current = true;
    var ps = R.useState('free'), planState = ps[0], setPlanState = ps[1];
    var dl = R.useState('on'), daily = dl[0], setDaily = dl[1];
    var pr = R.useState('monthly'), period = pr[0], setPeriod = pr[1];
    var cr = R.useReducer(ctaReduce, free, ctaInit), cta = cr[0], ctaDo = cr[1];
    /* Open plan dialogs. A set, as in the original: its dialogs never show, so a second trigger can
       "open" another on top, and Esc closes them one per press — yearly, then downgrade, then cancel. */
    var dg = R.useState({}), dlg = dg[0], setDlgs = dg[1];
    function openDlg(n) { setDlgs(function (s) { var o = Object.assign({}, s); o[n] = true; return o; }); }
    function closeDlg(n) { setDlgs(function (s) { var o = Object.assign({}, s); delete o[n]; return o; }); }
    var ys = R.useState(false), yearlySent = ys[0], setYearlySent = ys[1];
    var dlgRef = R.useRef(dlg); dlgRef.current = dlg;

    var first = R.useRef(true);
    R.useEffect(function () { if (first.current) { first.current = false; return; } ctaDo({ type: 'plan', free: free }); }, [plan]);

    function upgrade(name, unlocked) {
      IK.setPlan('paid');
      ctaDo({ type: 'plan', free: false });
      D.toast.success('You are on ' + name, { description: unlocked + ' are unlocked.' });
    }
    function pickPeriod(v) { setPeriod(v); ctaDo({ type: 'period', period: v }); }
    function openYearly() { setYearlySent(false); openDlg('yearly'); }

    var controls = [];
    if (section === 'balance' && !gone.current) controls.push({ label: 'Plan state', value: planState, onChange: setPlanState,
      options: [{ value: 'free', label: 'Free' }, { value: 'trial', label: 'Trial' }, { value: 'pro', label: 'Pro (trial)' }, { value: 'exhausted', label: 'Limit reached' }] });
    if (section === 'balance') controls.push({ label: 'Daily limit bar', value: daily, onChange: setDaily,
      options: [{ value: 'on', label: 'Daily on' }, { value: 'off', label: 'Daily off' }] });

    /* ── Sections ───────────────────────────────────────────────────────────────────────── */
    function managePlan() {
      var P = PRICES[period];
      return h(IK.AcctSection, { gap: 4, divider: false, pb: 'none' },
        h(IK.AcctPlanCurrent, { free: free, name: 'Starter Monthly', meta: 'Expires on Sep 30, 2026', onCancel: function () { openDlg('cancel'); } }),
        h(IK.AcctPlanHead, { size: 'lg', toggle: h(IK.AcctPeriodToggle, { value: period, onChange: pickPeriod, size: 'md', icons: true }) }),
        h('div', { className: 'pg-plan-grid mt-3 grid grid-cols-3 gap-4' },
          h(IK.AcctPlanCard, {
            name: 'Free', tagline: 'For getting started', price: '$0', per: 'excl. VAT', perHidden: true,
            cta: { id: 'acct-plan-cta-free', label: cta.free.label, variant: 'outline', disabled: cta.free.disabled,
                   onClick: function () { openDlg('downgrade'); } },
            features: ['1 user', '500 AI credits / month', 'Up to 3 data connectors', '24-hour data refresh', 'Community support']
          }),
          h(IK.AcctPlanCard, {
            name: 'Starter', period: P.period, ribbons: [{ tone: 'accent', label: '50% OFF' }], tagline: 'For small teams',
            price: P.starter[0], was: P.starter[1], per: 'excl. VAT',
            cta: { id: 'acct-plan-cta-starter', label: cta.starter.label, variant: cta.starter.variant, disabled: cta.starter.disabled,
                   onClick: function () { if (cta.starter.yearly) openYearly(); upgrade('Starter', 'Connections and metrics'); } },
            features: STARTER_FEATS
          }),
          h(IK.AcctPlanCard, {
            name: 'Pro', period: P.period, featured: true,
            ribbons: [{ tone: 'brand', label: 'Most popular' }, { tone: 'accent', label: '50% OFF' }], tagline: 'For growing teams',
            price: P.pro[0], was: P.pro[1], per: 'excl. VAT',
            cta: { id: 'acct-plan-cta-pro', label: 'Upgrade to Pro', variant: 'primary',
                   onClick: function () { upgrade('Pro', 'Every model, connection and metric'); } },
            features: ['Unlimited users', '25,000 AI credits / month', 'Unlimited data connectors', '15-minute data refresh', 'Full semantic-layer governance', 'Email + live-chat support', '99.5% SLA']
          })));
    }

    function balance() {
      var b = BALANCE[planState];
      return h('div', null,
        h(IK.AcctSection, { divider: false, pb: 3 },
          h('div', null,
            h(IK.AcctBalanceHead, { badges: b.badges, wrap: b.wrap }),
            h(IK.AcctBalanceHero, { amount: b.amount, icon: 'wallet', onUpgrade: function () { setSection('manage-plan'); } }),
            h('div', { className: 'mt-3 flex flex-col gap-4' },
              h(IK.AcctPool, { name: 'Subscription', coin: 'brand', left: b.sub.left, meta: b.sub.meta, percent: b.sub.pct, barLabel: b.sub.label }),
              daily === 'on' ? h(IK.AcctPool, { name: 'Daily limit', left: b.daily.left, meta: b.daily.meta, percent: b.daily.pct, barLabel: b.daily.label }) : null,
              h(IK.AcctPool, { name: 'Purchased', coin: 'green', left: b.purchased })))),
        h(IK.AcctBuyCredits, { id: 'acct-buy-block', tray: 'page', empty: !!b.noPacks }),
        h(IK.AcctSection, null,
          h(D.Typography, { element: 'div', textStyle: 'title14', textColor: 'primary' }, 'Credit usage'),
          h(IK.AcctTable, { columns: [{ label: 'Date' }, { label: 'Request type' }, { label: 'Spent credits' }], rows: USAGE })));
    }

    var body;
    if (section === 'my-account') body = h(IK.AcctMyAccount, { onChangePassword: function () { setSection('change-password'); } });
    else if (section === 'manage-plan') body = managePlan();
    else if (section === 'billing') body = h(IK.AcctBilling, {
      plan: { name: 'Starter', price: '$7.99 / user / month' }, next: { amount: '$7.99', date: 'Sep 30, 2026' }, rows: INVOICES,
      onChangePlan: function () { setSection('manage-plan'); } });
    else if (section === 'balance') body = balance();
    else if (section === 'leave-feedback') body = h(IK.AcctFeedback);
    else if (section === 'change-password') body = h(IK.AcctChangePassword, { onCancel: function () { setSection('my-account'); } });

    return h('div', { className: 'flex h-svh flex-col overflow-hidden' },
      h(IK.ReviewBar, { title: 'Metrics · Account modal', status: 'approved', size: 'sm', plan: true, controls: controls }),
      h('main', { className: 'relative min-h-0 flex-1 bg-surface-page', 'aria-label': 'Account modal' },
        h(IK.AcctModal, {
          section: section, onSection: setSection,
          /* A plan dialog takes Esc first — one press never closes both surfaces. (When the dialogs
             render, DevartUI's Modal consumes the key itself and this never runs.) */
          onEscape: function () {
            var top = ['yearly', 'downgrade', 'cancel'].filter(function (n) { return dlgRef.current[n]; })[0];
            if (!top) return false;
            closeDlg(top); return true;
          }
        }, h('div', { key: section }, body))),
      !SHOW_PLAN_DIALOGS ? null : h(IK.AcctConfirmDialog, {
        open: !!dlg.cancel, onOpenChange: function (o) { if (!o) closeDlg('cancel'); },
        title: 'Cancel Starter plan?', items: STARTER_FEATS,
        text: 'Your plan stays active until Sep 30, 2026, then moves to Free. You will lose access to these:',
        cancelLabel: 'Keep Starter', confirmLabel: 'Cancel Plan', confirmVariant: 'destructive'
      }),
      !SHOW_PLAN_DIALOGS ? null : h(IK.AcctConfirmDialog, {
        open: !!dlg.downgrade, onOpenChange: function (o) { if (!o) closeDlg('downgrade'); },
        title: 'Switch to Free?', items: STARTER_FEATS,
        text: 'You will lose access to these at the end of the current billing period:',
        cancelLabel: 'Keep Current Plan', confirmLabel: 'Switch to Free', confirmVariant: 'primary'
      }),
      !SHOW_PLAN_DIALOGS ? null : h(IK.AcctYearlyDialog, {
        open: !!dlg.yearly, sent: yearlySent, onSend: function () { setYearlySent(true); },
        onOpenChange: function (o) { if (!o) closeDlg('yearly'); }
      }),
      h(D.Toaster));
  }
  IK.mount(App);
})();
</script>
</body>
</html>

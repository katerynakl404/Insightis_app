<style>
  /* Page layout only. The list column (IK.ListPage — DevartUI ListPageLayout, its own scroller) and
     the preview split the main column side by side: the preview is a third column, so the list
     narrows, and it keeps the full height while the list scrolls (the original scrolled as a
     document and stuck the preview to the viewport; DevartUI's layout scrolls the column — 2026-10-19).
     Below 1024px the preview (IK.FileDetails) covers the split (DsFilePreview.css). The upload tray docks
     bottom-right of the viewport, under the dialogs. */
  .pg-split { position: relative; display: flex; flex: 1 1 0; min-width: 0; min-height: 0; }
  .pg-col { position: relative; display: flex; flex-direction: column; flex: 1 1 0; min-width: 0; min-height: 0; }
  .pg-upl-dock { position: fixed; right: 1.25rem; bottom: 1.25rem; z-index: 40; width: min(26rem, calc(100vw - 2.5rem)); }
  @media (max-width: 600px) { .pg-upl-dock { left: 1rem; right: 1rem; bottom: 1rem; width: auto; } }
</style>

<body>
<div id="root"></div>
<script>
/* Data Sources → Files, rebuilt from pages/approved/data-sources_files-landing.html.
   Locked rules: page-changes/data-sources_files-landing.md (apply here unchanged).
   Title + storage mark (IK.DsStorageMark) · drop zone (IK.DsDropZone) · the Type filter (DevartUI
   FilterMenu; + Owner when something is shared) · the bar over the list (DevartUI ListSelectionBar: count + Select all, or the selection and its bulk actions) · the
   library (IK.DsFilesTable, 20 at a time + IK.LoadMore) · File details beside it (IK.FileDetails — the one panel,
   the same on a workspace's page) · uploads in DevartUI's ActivityTray · Delete (IK.DsDeleteFilesDialog) — a file has no Rename (user, 2026-10-20: «забирай — його не буде»).
   Shared workspaces (on unless ?ws=0; rules: approved/workspace.rules.md): shared files in the one list with the
   people glyph after the name; Share via Workspace (IK.WsShareFileDialog); Remove from Workspace asks first.
   Review switches, as in the original topbar: Within limit/Over limit · Plan · Filled/Empty ·
   Loaded/Skeleton · Theme; with workspaces on, Plan is RK.workspaceControls' (Paid · Trial · Free), + Invited ·
   Reset Data. */
(function () {
  var IK = window.InsightisKit, RK = window.ReviewKit, D = window.DevartUI, R = window.React, h = IK.h;

  IK.defineIcons({
    'pg-download': '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="3" x2="12" y2="15"/>',
    'pg-trash': '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>',
    'pg-chev': '<polyline points="6 9 12 15 18 9"/>',
    'pg-doc': '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
    /* the upload tray's glyphs — verbatim from the original's UPL_SPIN / UPL_CHECK / UPL_ALERT */
    'pg-upl-spin': '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
    'pg-upl-check': '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
    'pg-upl-alert': '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
  });

  /* Verbatim seed — 24 rows (> one page), newest first. */
  var SEED = [
    ['quarterly-report.csv', 'csv', 'artifact', '2.4 MB', '3d ago'], ['customer-data.xlsx', 'xlsx', 'uploaded', '890 KB', 'last week'],
    ['sales-metrics.xls', 'xls', 'uploaded', '1.1 MB', '2 weeks ago'], ['revenue-forecast.xlsx', 'xlsx', 'artifact', '1.6 MB', '3 weeks ago'],
    ['churn-analysis.csv', 'csv', 'artifact', '512 KB', 'last month'], ['marketing-spend.xlsx', 'xlsx', 'uploaded', '2.1 MB', 'last month'],
    ['user-signups.csv', 'csv', 'uploaded', '340 KB', 'last month'], ['cohort-retention.xls', 'xls', 'artifact', '780 KB', '2 months ago'],
    ['nps-survey.csv', 'csv', 'uploaded', '220 KB', '2 months ago'], ['support-tickets.xlsx', 'xlsx', 'uploaded', '1.9 MB', '2 months ago'],
    ['ad-performance.csv', 'csv', 'artifact', '610 KB', '2 months ago'], ['inventory-snapshot.xlsx', 'xlsx', 'uploaded', '3.2 MB', '3 months ago'],
    ['pricing-experiments.csv', 'csv', 'artifact', '145 KB', '3 months ago'], ['web-traffic.xls', 'xls', 'uploaded', '990 KB', '3 months ago'],
    ['feature-usage.csv', 'csv', 'artifact', '830 KB', '3 months ago'], ['payroll-summary.xlsx', 'xlsx', 'uploaded', '470 KB', '4 months ago'],
    ['vendor-list.csv', 'csv', 'uploaded', '88 KB', '4 months ago'], ['budget-2026.xlsx', 'xlsx', 'uploaded', '1.3 MB', '4 months ago'],
    ['lead-scoring.csv', 'csv', 'artifact', '560 KB', '5 months ago'], ['region-breakdown.xls', 'xls', 'artifact', '720 KB', '5 months ago'],
    ['email-campaigns.csv', 'csv', 'uploaded', '410 KB', '5 months ago'], ['product-catalog.xlsx', 'xlsx', 'uploaded', '2.7 MB', '6 months ago'],
    ['subscription-mrr.csv', 'csv', 'artifact', '275 KB', '6 months ago'], ['exit-survey.xlsx', 'xlsx', 'uploaded', '640 KB', '6 months ago']
  ].map(function (r, i) { return { id: 'f' + (i + 1), name: r[0], type: r[1], origin: r[2], size: r[3], date: r[4], sortIdx: i, selected: false }; });

  var PAGE_SIZE = 20;
  /* Storage: the plan sets the SIZE of the box; over the limit is a ratio (cap × 1.05), so it reads
     as over on both caps (52.5 MB of 50 MB, 1.1 GB of 1 GB). */
  var CAP = { free: { label: '50 MB', mb: 50 }, paid: { label: '1 GB', mb: 1024 } };
  var USED_WITHIN = 38.6, OVER_RATIO = 1.05;
  var BROWSE = [['q2-report.csv', 'csv', '3.1 MB'], ['new-customers.xlsx', 'xlsx', '1.2 MB'], ['budget-2026.xls', 'xls', '456 KB'], ['pipeline.csv', 'csv', '780 KB']];

  function App() {
    /* shared workspaces (approved/workspace.rules.md): on unless ?ws=0 */
    var wsq = RK.useWsQuery(), ws = IK.useWorkspaces(RK.wsStore(wsq)), wsOn = wsq.on;
    var plan = IK.usePlan(), free = plan[0] === 'free';
    var quota = RK.useQueryState('storage', 'within');
    /* File details is the unified panel (IK.DetailsPanel via IK.fileDetails), the only one — the product's old preview is
       gone (user, 2026-10-22: "лишаєм нову панель всюди") */
    IK.wsMarks = { popover: true, renewal: function (by) {
      return IK.wsRenewal(ws, ws.list.filter(function (x) { return x.role === 'member' && x.owner.name === by; }).map(function (x) { return x.id; }));
    } };
    var data = RK.useQueryState('data', 'filled');
    var load = RK.useQueryState('load', 'loaded');
    var phone = D.useMaxWidth(768);

    var fs = R.useState(function () { return data[0] === 'empty' ? [] : SEED; }), files = fs[0], setFiles = fs[1];
    var bk = R.useRef(data[0] === 'empty' ? SEED : null);
    var em = R.useState(false), editing = em[0], setEditing = em[1];
    var fl = R.useState('all'), filter = fl[0], setFilter = fl[1];
    /* shared workspaces (on, invited to one at least): the shared files sit in the one list with the people glyph
       after the name and an Owner filter (Owner is the one way, 2026-10-20) — they view, download and add to a
       chat; nothing to delete */
    /* Empty is empty: nothing shared either (user, 2026-10-19) */
    var sharedFiles = wsOn && data[0] !== 'empty' ? IK.wsSharedFiles(ws.list, { locked: free }) : [];
    var hasShared = sharedFiles.length > 0, inList = hasShared;
    /* own vs shared is the Owner filter, not a "Hide shared" switch */
    var mineOnly = false;
    /* a shared file in the person's list: the page's own date words, placed by its date */
    function rel(t) {
      var d = Math.max(0, Math.round((Date.now() - t) / 864e5));
      return d < 7 ? d + 'd ago' : d < 14 ? 'last week' : d < 30 ? Math.round(d / 7) + ' weeks ago' : d < 60 ? 'last month' : Math.round(d / 30) + ' months ago';
    }
    function relIdx(t) { var d = (Date.now() - t) / 864e5; return d <= 3 ? 0.5 : d <= 7 ? 1.5 : d <= 14 ? 2.5 : d <= 21 ? 3.5 : d <= 45 ? 6.5 : d <= 75 ? 10.5 : 12 + d / 30; }
    var sharedInList = inList && !mineOnly ? sharedFiles.map(function (f) {
      return { id: f.id, name: f.name, type: f.type, origin: f.origin, size: f.size, date: rel(f.time), sortIdx: relIdx(f.time),
               shared: { ws: f.wsName, by: f.by }, by: f.by, wsNames: f.wsNames, wsIds: f.wsIds, links: f.links, menu: ['view', 'add-to-chat', 'download'], locked: f.locked, muted: f.muted };
    }) : [];
    var sd = R.useState('desc'), sortDir = sd[0], setSortDir = sd[1];
    var sc = R.useState(PAGE_SIZE), shown = sc[0], setShown = sc[1];
    var pv = R.useState(null), previewId = pv[0], setPreviewId = pv[1];
    var pw = R.useState(null), previewW = pw[0], setPreviewW = pw[1];
    /* shared workspaces: the file being shared (Share via Workspace) */
    var sw = R.useState(null), shareIds = sw[0], setShareIds = sw[1];
    /* Remove from Workspace asks first, as everywhere (IK.useWsRemoveConfirm) */
    var rm = IK.useWsRemoveConfirm();
    var dl = R.useState(null), delTarget = dl[0], setDelTarget = dl[1];
    var up = R.useState([]), upl = up[0], setUpl = up[1];
    var uplRef = R.useRef([]);
    function setUplBoth(next) { uplRef.current = next; setUpl(next); }
    var uo = R.useState(false), uplOpen = uo[0], setUplOpen = uo[1];
    var nextIdx = R.useRef(-1);

    var empty = files.length === 0;
    var cap = free ? CAP.free : CAP.paid;
    var used = empty ? 0 : (quota[0] === 'over' ? cap.mb * OVER_RATIO : USED_WITHIN);
    var overLimit = used > cap.mb;

    /* one's own, with the workspaces each is shared into (the Workspaces column) */
    var own = wsOn ? files.map(function (f) {
      var inWs = ws.owned.filter(function (w) { return w.files.some(function (x) { return x.id === f.id; }); });
      return inWs.length ? Object.assign({}, f, { sharedWith: inWs.map(function (w) { return w.name; }), links: IK.wsLinks(inWs) }) : f;
    }) : files;
    /* Shared: Owner — one Owner filter; the type chips stay about the type */
    var ofs = R.useState('any'), ownerF = inList ? ofs[0] : 'any', setOwnerF = ofs[1];
    var sharers = []; sharedInList.forEach(function (f) { if (sharers.indexOf(f.by) < 0) sharers.push(f.by); });
    var pool = own.filter(function () { return IK.wsOwnerPass(ownerF, null); }).concat(sharedInList.filter(function (f) { return IK.wsOwnerPass(ownerF, f.by); }));
    var vis = (filter === 'all' ? pool : filter === 'shared' ? pool.filter(function (f) { return !!f.shared; })
      : pool.filter(function (f) { return !f.shared && f.origin === filter; }))
      .slice().sort(function (a, b) { return sortDir === 'asc' ? b.sortIdx - a.sortIdx : a.sortIdx - b.sortIdx; });
    var selectedCount = vis.filter(function (f) { return f.selected; }).length;
    var ownVis = vis.filter(function (f) { return !f.shared; }).length;
    var allSel = ownVis > 0 && selectedCount === ownVis;
    var page = vis.slice(0, shown);
    var remaining = vis.length - page.length;

    function update(fn) { setFiles(function (l) { return l.map(fn); }); }
    function clearSel() { update(function (f) { return f.selected ? Object.assign({}, f, { selected: false }) : f; }); }
    function setAllVisible(on) {
      var ids = {}; vis.forEach(function (f) { ids[f.id] = 1; });
      update(function (f) { return ids[f.id] ? Object.assign({}, f, { selected: on }) : f; });
    }
    function changeFilter(v) { setFilter(v); setShown(PAGE_SIZE); setEditing(false); clearSel(); }
    function setData(v) {
      data[1](v);
      var base;
      if (v === 'empty') { if (files.length) bk.current = files; base = []; }
      else { base = bk.current || files; bk.current = null; }
      setFiles(base.map(function (f) { return Object.assign({}, f, { selected: false }); }));
      setEditing(false); setPreviewId(null); setShown(PAGE_SIZE);
    }
    function find(id) { return pool.find(function (f) { return f.id === id; }) || null; }

    function onAction(a, id) {
      var f = find(id); if (!f) return;
      if (a === 'view') { setPreviewId(id); return; }
      if (a === 'download') { D.toast('Download started'); return; }
      else if (a === 'share') setShareIds([id]);
      else if (a === 'delete') setDelTarget(id);
      else if (a === 'add-to-chat') location.assign(IK.wsHref('approved/chat-landing.html', { attach: f.name }));
    }
    function confirmDelete() {
      var t = delTarget; setDelTarget(null);
      /* said, as everywhere a file is deleted (IK.wsToast.deleted) */
      if (t === 'selected') {
        IK.wsToast.deleted(files.filter(function (f) { return f.selected; }).map(function (f) { return f.name; }));
        setFiles(function (l) { return l.filter(function (f) { return !f.selected; }); }); setEditing(false); return;
      }
      var gone = find(t); if (gone) IK.wsToast.deleted([gone.name]);
      if (previewId === t) setPreviewId(null);
      setFiles(function (l) {
        var next = l.filter(function (f) { return f.id !== t; });
        if (!next.some(function (f) { return f.selected; })) setEditing(false);
        return next;
      });
    }

    /* Uploads: each queued file ticks up to 100% (or to a seeded failure — anything that is not a
       spreadsheet / CSV); a file joins the library only when its OWN upload completes. Over the
       limit nothing is accepted, and the refusal arrives where the action was (a toast). */
    function queue(items) {
      if (overLimit) {
        D.toast.error('Storage is full', {
          id: 'dsf-over-limit', duration: 5000,
          description: free ? 'Nothing was uploaded. Delete some files, or upgrade to Pro for 1 GB.' : 'Nothing was uploaded. Delete some files to make room.'
        });
        return;
      }
      setUplBoth(uplRef.current.concat(items.map(function (it) {
        var ext = (it.name.split('.').pop() || '').toLowerCase();
        var ok = ['csv', 'xls', 'xlsx'].indexOf(ext) !== -1;
        return { name: it.name, pct: 0, state: 'uploading', ok: ok, err: ok ? '' : 'Unsupported format — upload a .csv, .xls or .xlsx file', file: it };
      })));
    }
    function browse() {
      var r = BROWSE[files.length % BROWSE.length];
      queue([{ id: 'f' + (files.length + 10), name: r[0], type: r[1], size: r[2] }]);
    }
    function drop(list) {
      var items = [];
      for (var i = 0; i < list.length; i++) {
        var n = list[i].name, ext = (n.split('.').pop() || '').toLowerCase();
        items.push({ id: 'fd' + Date.now() + '-' + i, name: n, type: ['csv', 'xls', 'xlsx'].indexOf(ext) !== -1 ? ext : 'other',
                     size: list[i].size ? (list[i].size / 1024 / 1024).toFixed(1) + ' MB' : '—' });
      }
      if (items.length) queue(items);
    }
    var live = upl.some(function (u) { return u.state === 'uploading'; });
    R.useEffect(function () {
      if (!live) return;
      var t = setInterval(function () {
        var landed = [];
        var next = uplRef.current.map(function (u) {
          if (u.state !== 'uploading') return u;
          var pct = Math.min(100, u.pct + 12 + Math.floor(u.name.length % 7));
          if (pct < 100) return Object.assign({}, u, { pct: pct });
          if (!u.ok) return Object.assign({}, u, { pct: pct, state: 'failed' });
          landed.push(u.file);
          return Object.assign({}, u, { pct: pct, state: 'done' });
        });
        setUplBoth(next);
        if (landed.length) setFiles(function (l) {
          return l.concat(landed.map(function (x) {
            return { id: x.id, name: x.name, type: x.type, origin: 'uploaded', size: x.size, date: 'just now', sortIdx: nextIdx.current--, selected: false };
          }));
        });
      }, 300);
      return function () { clearInterval(t); };
    }, [live]);
    var upUploading = upl.filter(function (u) { return u.state === 'uploading'; }).length;
    var upFailed = upl.filter(function (u) { return u.state === 'failed'; }).length;
    var trayStatus = upUploading ? 'uploading' : upFailed ? 'failed' : 'complete';
    var trayTitle = upUploading ? upUploading + ' uploading'
      : upFailed ? upFailed + ' of ' + upl.length + (upl.length === 1 ? ' upload failed' : ' uploads failed')
      : upl.length + (upl.length === 1 ? ' upload complete' : ' uploads complete');

    /* Esc: a dialog or a menu answers first (Radix); with neither open it closes the preview. */
    R.useEffect(function () {
      function k(e) {
        if (e.key !== 'Escape') return;
        if (document.querySelector('[role="dialog"][data-state="open"],[role="menu"]')) return;
        setPreviewId(null);
      }
      window.addEventListener('keydown', k, true);
      return function () { window.removeEventListener('keydown', k, true); };
    }, []);

    var previewFile = previewId ? find(previewId) : null;
    var noMatch = !empty && vis.length === 0;

    /* The bar over the list is DevartUI's ListSelectionBar: the count with Select all at rest, the
       selection ("N selected", Select all / Deselect all, the bulk actions, Exit selection) once a
       file is ticked. */
    var selecting = editing && selectedCount > 0;
    var meta = noMatch && !editing ? null : h(D.ListSelectionBar, {
      title: vis.length + ' ' + (vis.length === 1 ? 'file' : 'files'),
      selectedText: selectedCount + ' selected',
      selectedCount: selecting ? selectedCount : 0,
      allSelected: allSel,
      isEmpty: vis.length === 0,
      exitSelectionLabel: 'Exit selection',
      onSelectAll: function () { setEditing(true); setAllVisible(true); },
      onClearSelection: function () { setEditing(false); clearSel(); },
      rightSlot: selecting
        ? h(IK.Fragment, null,
            /* shared workspaces (on): the selection can be shared too — locked on Free (their workspaces are Blocked) */
            wsOn && ws.owned.length ? h(IK.Locked, { feature: 'workspaces', locked: free, surface: 'modal', tip: 'Available on Pro' },
              h(D.Button, { variant: 'tertiary', size: 'sm', type: 'button', leftSlot: h(IK.Icon, { name: 'ws-share' }),
                onClick: function () { setShareIds(vis.filter(function (f) { return f.selected; }).map(function (f) { return f.id; })); } }, 'Share via Workspace')) : null,
            h(D.Button, { variant: 'tertiary', size: 'sm', type: 'button', leftSlot: h(IK.Icon, { name: 'pg-download' }),
              onClick: function () { var n = vis.filter(function (f) { return f.selected; }).length; D.toast(n > 1 ? 'Downloading ' + n + ' files' : 'Download started'); } }, 'Download'),
            h(D.Button, {
              variant: 'destructiveTertiary', size: 'sm', type: 'button',
              leftSlot: h(IK.Icon, { name: 'pg-trash' }), onClick: function () { setDelTarget('selected'); }
            }, 'Delete'))
        : phone ? h(IK.Tip, { tip: 'Sort by date' },
            h('button', {
              type: 'button', 'aria-label': 'Sort by date', className: IK.cx('inline-flex items-center gap-1 rounded text-xs text-ink-secondary', D.focusRing),
              onClick: function () { setSortDir(sortDir === 'asc' ? 'desc' : 'asc'); }
            }, sortDir === 'asc' ? 'Oldest' : 'Newest',
              h(IK.Icon, { name: 'pg-chev', size: 12, style: sortDir === 'asc' ? { transform: 'rotate(180deg)' } : undefined })))
        : undefined
    });

    /* the person's own files: the drop zone and the library */
    var myFiles = h('div', { className: 'flex flex-col gap-4' },
                h(IK.DsDropZone, { onBrowse: browse, onFiles: drop }),
                /* the invitation first: something shared waits for Accept (user, 2026-10-20) */
                (function () {
                /* on a list only the invitation that waits for Accept; the others (another address, expired, unavailable)
                   come after the sign-in, on the chat (rule 15; user, 2026-10-20) */
                /* no invitation here (user, 2026-10-20) — it shows on the chat and the Workspaces list */
                return inList && !mineOnly ? h(IK.WsSharedNotices, { ws: ws, free: free, trial: wsq.trial, module: 'Files', feature: 'shared-files' }) : null;
                })(),
                load[0] === 'skeleton' ? h(IK.DsFilesSkeleton) : h('div', { className: 'flex flex-col gap-2' },
                  /* Shared: Owner — two filters as pills, Type and Owner, where the chips are (user, 2026-10-19) */
                  h('div', { className: 'flex flex-wrap items-center gap-2' },
                    h(D.FilterMenu, { label: 'Type', value: filter, onValueChange: changeFilter,
                      options: [{ value: 'all', label: 'All' }, { value: 'artifact', label: 'Artifacts' }, { value: 'uploaded', label: 'Uploaded' }] }),
                    inList ? h(D.FilterMenu, { label: 'Owner', value: ownerF, onValueChange: function (v) { setOwnerF(v); setShown(PAGE_SIZE); }, options: IK.wsOwnerOptions({ me: own.length, shared: sharedFiles.length }) }) : null,
                    h(IK.WsClearFilters, { show: filter !== 'all' && ownerF !== 'any', onClear: function () { changeFilter('all'); setOwnerF('any'); } })),
                  meta,
                  noMatch ? h(D.StatusView, {
                    size: 'lg', surface: 'embedded', withIconHalo: false, icon: h(D.EmptyStateIllustration),
                    title: 'No matches found', description: 'No files match this filter — switch back to All to see every file'
                  }) : h(IK.DsFilesTable, {
                    files: page, empty: empty && !sharedInList.length, editing: editing, previewId: previewId, sortDir: sortDir, wsCol: false /* the workspaces in the preview's Access only (user, 2026-10-20) */, ownerMark: true,
                    /* Owner only where the list mixes others' files with one's own: on My Files it would say You on every row */
                    /* no Owner column in the one list: who shared it is in the people glyph's tooltip */
                    ownerCol: false,
                    allState: allSel ? true : selectedCount ? 'indeterminate' : false,
                    onSort: function () { setSortDir(sortDir === 'asc' ? 'desc' : 'asc'); },
                    onToggle: function (id) { update(function (f) { return f.id === id ? Object.assign({}, f, { selected: !f.selected }) : f; }); setEditing(true); },
                    onToggleAll: function () { setAllVisible(!allSel); setEditing(!allSel); },
                    onOpen: setPreviewId, onAction: onAction, onBrowse: browse,
                    /* shared workspaces (on): "Share via Workspace" in the ⋮ of the person's files (locked on
                       Free — their workspaces are Blocked) */
                    menuItems: wsOn && ws.owned.length ? ['add-to-chat', 'share', 'download', 'delete'] : undefined,
                    menuLock: wsOn && free ? { share: { feature: 'workspaces', locked: true } } : undefined
                  }),
                  noMatch ? null : h(IK.LoadMore, { left: remaining, onClick: function () { setShown(shown + PAGE_SIZE); } })));

    return h(IK.Fragment, null,
      h(RK.ReviewBar, { title: 'Data Sources (Files)', status: 'approved', size: 'sm', autoHeight: true, controls: [
        { label: 'Storage state', value: quota[0], onChange: quota[1],
          options: [{ value: 'within', label: 'Within limit' }, { value: 'over', label: 'Over limit' }] },
        RK.wsOwnsPlan(wsq) ? null : { label: 'Plan', value: plan[0], onChange: plan[1],
          options: [{ value: 'paid', label: 'Paid' }, { value: 'free', label: 'Free' }] },
        { label: 'Data state', value: data[0], onChange: setData,
          options: [{ value: 'filled', label: 'Filled' }, { value: 'empty', label: 'Empty' }] },
        { label: 'Page state', value: load[0], onChange: load[1],
          options: [{ value: 'loaded', label: 'Loaded' }, { value: 'skeleton', label: 'Skeleton' }] }
      ].concat(RK.workspaceControls({ here: 'files' })) }),
      h(IK.AppShell, { nav: 'files', burger: false, scroll: false, brandLink: false, accountIcons: 'classic', workspaces: wsOn ? ws : null, trialDays: wsOn && wsq.trial && IK.getPlan() !== 'free' ? 3 : undefined },
        h('div', { className: 'pg-split' },
          h('div', { className: 'pg-col' },
            h(IK.ListPage, {
                title: 'Files',
                after: h(IK.DsStorageMark, { usedMb: used, capMb: cap.mb, capLabel: cap.label, planName: free ? 'Free' : 'Pro', cta: free })
              },
              myFiles)),
          /* the preview offers what the file's row offers (user, 2026-10-20): its ⋮ (no View — it is open — and no
             Download — the head's icon), Share via Workspace in Access for one's own, Ask to Renew for an unavailable one */
          /* New: the unified panel in the preview's own aside (its width and edge), no Sheet */
          previewFile ? (function () {
            var pf = previewFile, mineF = !pf.by, canChat = (pf.menu || ['add-to-chat']).indexOf('add-to-chat') >= 0;
            return h(IK.FileDetails, { file: pf, onClose: function () { setPreviewId(null); setPreviewW(null); }, width: previewW, onWidthChange: setPreviewW,
              onDownload: function () { D.toast('Download started'); },
              onAddToChat: canChat ? function (id) { onAction('add-to-chat', id); } : null,
              onDelete: mineF ? function (id) { onAction('delete', id); } : null,
              onShare: mineF && wsOn && ws.owned.length ? function (id) { onAction('share', id); } : null, shareLocked: free,
              renewal: pf.by ? IK.wsRenewal(ws, pf.wsIds || []) : null,
              onRemoveFromWorkspace: mineF && wsOn ? function (it, f) {
                rm.ask({ kind: 'file', name: f.name, wsName: it.name, run: function () { if (it.id) ws.unshareFile(it.id, f.id); } });
              } : undefined });
          })() : null)),
      upl.length ? h('div', { className: 'pg-upl-dock' },
        h(D.ActivityTray, {
          headerTitle: trayTitle,
          headerIcon: trayStatus === 'uploading'
            ? h(IK.Icon, { name: 'pg-upl-spin', className: 'animate-spin motion-reduce:animate-none' })
            : h(IK.Icon, { name: trayStatus === 'failed' ? 'pg-upl-alert' : 'pg-upl-check' }),
          open: uplOpen, onOpenChange: setUplOpen,
          onDismiss: function () { setUplBoth([]); setUplOpen(false); }, dismissLabel: 'Dismiss uploads',
          toggleLabel: uplOpen ? 'Hide the files' : 'Show the files',
          'aria-label': 'File uploads', role: 'region'
        }, upl.map(function (u, i) {
          var up = u.state === 'uploading', bad = u.state === 'failed';
          return h(D.ActivityTrayItem, {
            key: u.name + i, title: u.name, icon: h(IK.Icon, { name: 'pg-doc' }),
            hasProgress: up, progress: up ? u.pct : undefined, progressLabel: 'Uploading ' + u.name,
            errorText: bad ? u.err : undefined,
            rightSlot: up ? u.pct + '%' : bad ? h(D.LinkButton, { asChild: true },
              h('button', { type: 'button', onClick: function (e) {
                e.stopPropagation();
                setUplBoth(uplRef.current.map(function (x) { return x.name === u.name ? Object.assign({}, x, { state: 'uploading', pct: 0, ok: true, err: '' }) : x; }));
              } }, 'Retry')) : undefined,
            /* the row's own status mark, coloured as the original's .upl-item-stat */
            trailingIcon: up ? undefined : bad
              ? h(IK.Icon, { name: 'pg-upl-alert', label: 'Failed', className: 'text-fb-red-text' })
              : h(IK.Icon, { name: 'pg-upl-check', label: 'Done', className: 'text-fb-green' })
          });
        }))) : null,
      h(IK.DsDeleteFilesDialog, {
        open: !!delTarget, count: delTarget === 'selected' ? selectedCount : 1,
        onOpenChange: function (o) { if (!o) setDelTarget(null); }, onConfirm: confirmDelete
      }),
      wsOn ? h(IK.WsShareFileDialog, (function () {
        /* the file(s) as the workspace store keeps them (the person's own, same ids) */
        var files = (shareIds || []).map(function (id) {
          var f = find(id); if (!f) return null;
          return IK.WS_FILES.filter(function (x) { return x.id === id; })[0] || { id: f.id, name: f.name, type: f.type, kind: f.origin, size: f.size, date: Date.now() };
        }).filter(Boolean);
        return {
          open: !!(shareIds && shareIds.length), onOpenChange: function (o) { if (!o) setShareIds(null); },
          files: files, workspaces: ws.owned, createLocked: free,
          taken: function (n) { return IK.wsNameTaken(ws.list, n); },
          onCreate: function (n, d) { return ws.create(n, d); },
          onShare: function (ids, out) {
            out = out || [];
            ids.forEach(function (wid) {
              var w = ws.find(wid);
              files.forEach(function (f) { if (!w || !w.files.some(function (x) { return x.id === f.id; })) ws.shareFile(wid, f); });
            });
            out.forEach(function (wid) { files.forEach(function (f) { ws.unshareFile(wid, f.id); }); });
            setShareIds(null);
            if (ids.length) IK.wsToast.added(ws, ids, { kind: 'file', name: files[0].name, count: files.length });
          }
        };
      })()) : null,
      rm.dialog,
      h(D.Toaster, { position: 'top-right' }));
  }
  IK.mount(App);
})();
</script>
</body>
</html>

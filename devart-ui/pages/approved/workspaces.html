<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insightis · Workspaces</title>
<link rel="stylesheet" href="../../../ds-bundle/styles.css">
<link rel="stylesheet" href="../../insightis-kit/insightis-kit.css?v=05a7b4effe">

<script src="../../../ds-bundle/_vendor/react.js"></script>
<script src="../../../ds-bundle/_ds_bundle.js"></script>
<script src="../../insightis-kit/insightis-kit.js?v=05a7b4effe"></script>
<script src="../../review-kit/review-kit.js?v=05a7b4effe"></script>

<style>
  /* Page layout only: File details (IK.FileDetails) splits the main column as on Files — a third
     column beside the list; below 1024px it covers the list (DsFilePreview.css) */
  .pg-split { position: relative; display: flex; flex: 1 1 0; min-width: 0; min-height: 0; }
</style>
<body>
<div id="root"></div>
<script>
/* Workspaces — one page, two screens, as the AI connectivity prototype keeps its list (#/) and an
   opened workspace (#/w1) in one place (user, 2026-10-19). Shared workspaces, phase 1 (Claude Doc
   «Дизайн: Shared workspaces, фаза 1», AIINS-1852 / 1858 / 1866 / 1887). Rules: approved/workspace.rules.md.
   Reached from the sidebar's Workspaces row, under New Chat.

   the list (no ?w)   ListView — the title row with Create Workspace (round, as Insightis title-row
                      actions; under the title on a phone), the search (DevartUI SearchInput, as Metrics /
                      Catalog / Chats), the Owner filter (DevartUI FilterMenu: Anyone · Me · Shared with me,
                      when there are both), DevartUI ListSelectionBar (count · Select all → the selection +
                      bulk Leave / Delete), IK.WsList: own and invited workspaces in one list (the role is
                      the workspace's), 20 at a time + Load more; a row opens the workspace (?w=). Invite /
                      Add Connection from a row's ⋮ open their dialogs here; a connection in its menu opens
                      Connection details (IK.ConnectionDetails) here.
   a workspace (?w=)  WorkspaceView — "Back to workspaces" (PageHeader onBack) returns to the list in
                      place. Owner and invited alike: Overview · Connections · Metrics · Files · Members. The
                      Owner's tabs act as the own pages do (IK.useWsPanelActions: Data Sources' ⋮ and cells,
                      Metrics' rows, Files' ⋮ and bulk bar, the same details panels and dialogs) + Remove from
                      Workspace, which always asks first; the title row's action follows the tab (Add
                      Connection · Create Metric · Add Files · Invite Members); Blocked → IK.WsNotice + those
                      locked. Invited: read-only, every management control absent. ?do=add|invite|files
                      opens that dialog once.
   Details: IK.ConnectionDetails, IK.MetricDetails (in IK.WsMetrics), IK.FileDetails — the panels Data Sources,
   Metrics and Files open. Review switches (live, independent): the list — Plan · Invited · Data · Reset Data ·
   Theme; a workspace — Plan · Role · Invited · Data · Reset Data · Theme. */
(function () {
  var IK = window.InsightisKit, RK = window.ReviewKit, D = window.DevartUI, R = window.React, h = IK.h;

  /* this page is the feature: it is always on */
  (function () {
    var u = new URL(location.href);
    if (!u.searchParams.get('ws')) { u.searchParams.set('ws', '1'); history.replaceState(null, '', u); }
  })();

  function strong(t) { return h('span', { className: 'font-medium text-ink-primary' }, t); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function names(list) {
    var n = list.slice(0, 3).map(function (w) { return w.name; });
    return list.length > 3 ? n.concat([plural(list.length - 3, 'other', 'others')]) : n;
  }

  var MY_ALIASES = ['@mrr_growth', '@issues_created', '@issues_resolved', '@sprint_velocity', '@bug_count', '@prs_opened', '@prs_merged'];

  function toFile(f) { return { id: f.id, name: f.name, type: f.type, origin: f.kind, size: f.size, date: IK.wsFmtDate(f.date), time: f.date }; }

  /* a tab with nothing in it: DevartUI StatusView, the kit lists' own empty state */
  function emptyState(o) {
    return h(D.StatusView, { size: 'lg', surface: 'embedded', withIconHalo: false, icon: h(D.EmptyStateIllustration), title: o.title, description: o.description, actions: o.action });
  }

  function ListView() {
    var q = RK.useWsQuery();
    var ws = IK.useWorkspaces(RK.wsStore(q));
    var plan = IK.usePlan()[0], free = plan === 'free', trial = q.trial && !free;
    /* the details panels are the very ones Data Sources, Files and Metrics open — their actions and dialogs (user,
       2026-10-22: "всі панелі не залежно від місця мали виглядати однаково!", "лишаєм нову панель всюди") */
    var pa = IK.useWsPanelActions(ws, { free: free });
    IK.wsMarks = { popover: true, renewal: function (by) {
      return IK.wsRenewal(ws, ws.list.filter(function (x) { return x.role === 'member' && x.owner.name === by; }).map(function (x) { return x.id; }));
    } };
    var sq = RK.useQueryState('q', ''), query = sq[0], setQuery = sq[1];
    /* own and shared apart (user, 2026-10-19): the Owner filter — all · mine · shared */
    var rf = RK.useQueryState('own', 'all'), roleF = rf[0], setRoleF = rf[1];
    var cr = R.useState(false), creating = cr[0], setCreating = cr[1];
    var rn = R.useState(null), renaming = rn[0], setRenaming = rn[1];
    var dl = R.useState(null), deleting = dl[0], setDeleting = dl[1];
    var lv = R.useState(null), leaving = lv[0], setLeaving = lv[1];
    /* a connection opened from the list's menu: Connection Details, in place */
    var cp = R.useState(null), conn = cp[0], setConn = cp[1];
    /* Invite / Add Connection from the list: the dialog opens here (user, 2026-10-19); an invitation sent goes to
       the workspace's Members tab, an added connection stays on the list, its toast linking there (2026-10-20) */
    var ac = R.useState(null), acting = ac[0], setActing = ac[1];
    var aw = acting && ws.find(acting.w.id);
    function done(w, tab) { setActing(null); RK.setWs({ w: w.id, tab: tab }); }
    var sl = R.useState([]), selected = sl[0], setSelected = sl[1];
    var of = R.useState({}), off = of[0], setOff = of[1];
    function dismiss(k) { return function () { var o = Object.assign({}, off); o[k] = true; setOff(o); }; }


    function create() { setCreating(true); }
    var createBtn = h(IK.Locked, { feature: 'workspaces', locked: free, surface: 'modal', tip: 'Available on Pro' },
      /* the first-run banner's action: secondary, as the Data Sources banner's Browse Catalog */
      h(D.Button, { variant: 'secondary', size: 'sm', type: 'button', leftSlot: h(IK.Icon, { name: 'plus' }), onClick: create }, 'Create Workspace'));
    /* the title row's action is round, as every Insightis page's is (Create Connection, Create
       Metric); on a phone it keeps its label and drops under the title (ListPage wrap, as Metrics) */
    var headerAction = h(IK.Locked, { feature: 'workspaces', locked: free, surface: 'modal', tip: 'Available on Pro' },
      h(D.Button, { variant: 'primary', size: 'sm', rounded: 'full', type: 'button', leftSlot: h(IK.Icon, { name: 'plus' }), onClick: create }, 'Create Workspace'));

    var both = ws.owned.length > 0 && ws.shared.length > 0;
    var all = ws.owned.concat(ws.shared);
    /* with one kind only there is nothing to filter: the whole list */
    var role = roleF;
    var list = !both || role === 'all' ? all : role === 'mine' ? ws.owned : ws.shared;
    var qq = query.trim().toLowerCase();
    var vis = qq ? list.filter(function (w) { return w.name.toLowerCase().indexOf(qq) >= 0; }) : list;
    /* every row can be picked (user, 2026-10-19): one's own to delete, an invited one to leave */
    var mine = vis;
    var sel = selected.filter(function (id) { return mine.some(function (w) { return w.id === id; }); });
    var selOwn = sel.filter(function (id) { var w = ws.find(id); return w && w.role === 'owner'; });
    var selInv = sel.filter(function (id) { var w = ws.find(id); return w && w.role !== 'owner'; });

    /* the trial, said ahead: the Owner's workspaces stop for members, the Member's shared items stop */
    var counts = { connections: 0, metrics: 0, files: 0 };
    ws.shared.forEach(function (w) {
      counts.connections += w.connections.length; counts.files += w.files.length;
      w.connections.forEach(function (c) { counts.metrics += c.metrics.length; });
    });
    /* no invitation banner anywhere (user, 2026-10-20: "банер запрошення ніде не треба") — the invitation is the email */
    var notices = [
      /* the plan's alert, as on Data Sources, Metrics and Files (user, 2026-10-22: "мав з'явитись і на воркспейсах каталозі") */
      free && ws.shared.length && !off.p ? h(IK.WsNotice, { key: 'p', kind: 'shared-plan', module: 'Workspaces', feature: 'workspaces', onDismiss: dismiss('p') }) : null,
      trial && all.length && !off.t ? h(IK.WsNotice, { key: 't', kind: 'trial', owned: names(ws.owned), sharedFrom: names(ws.shared), counts: counts, onDismiss: dismiss('t') }) : null
    ].filter(Boolean);

    /* DevartUI ListSelectionBar, as Files: the count · Select all at rest; "N selected", Exit
       selection and Leave / Delete once a row is ticked. */
    /* an action that can never happen is not shown: with none of the person's own rows in view there is
       nothing to select, so the line is the count alone (DevartUI MetaRow, as Chats) */
    /* a bulk action: disabled with the reason in its tooltip when the pick holds the other kind */
    function bulkAct(label, icon, off, why, run) {
      var btn = h(D.Button, { variant: 'destructiveTertiary', size: 'sm', type: 'button', disabled: off, leftSlot: h(IK.Icon, { name: icon }), onClick: off ? undefined : run }, label);
      return off ? h(IK.Tip, { key: label, tip: why, wrap: true }, h('span', { className: 'inline-flex', tabIndex: 0 }, btn)) : h(IK.Fragment, { key: label }, btn);
    }
    var bar = !vis.length ? null : !mine.length ? h(D.MetaRow, null, h(D.MetaRowCount, null, plural(vis.length, 'workspace', 'workspaces'))) : h(D.ListSelectionBar, {
      title: plural(vis.length, 'workspace', 'workspaces'),
      selectedText: sel.length + ' selected',
      selectedCount: sel.length,
      allSelected: mine.length > 0 && sel.length === mine.length,
      exitSelectionLabel: 'Exit selection',
      onSelectAll: function () { setSelected(mine.map(function (w) { return w.id; })); },
      onClearSelection: function () { setSelected([]); },
      /* Leave is for the invited ones, Delete for the person's own: each is there whenever such rows are in the list,
         and works only when the pick is all of its kind — otherwise it is disabled and says why (user, 2026-10-20:
         'правильніше дізейблити з поясненням'); a pick changes, so the action comes back */
      rightSlot: sel.length ? h('div', { className: 'flex items-center gap-1' },
        vis.some(function (w) { return w.role !== 'owner'; }) ? bulkAct('Leave', 'ws-leave', !selInv.length || selOwn.length > 0,
          'You can’t leave a workspace you own — deselect it, or delete it', function () { setLeaving({ ids: selInv }); }) : null,
        vis.some(function (w) { return w.role === 'owner'; }) ? bulkAct('Delete', 'delete', !selOwn.length || selInv.length > 0,
          'Only the owner can delete a workspace — deselect the ones shared with you', function () { setDeleting({ ids: selOwn }); }) : null) : undefined
    });

    var delList = deleting ? deleting.ids.map(function (id) { return ws.find(id); }).filter(Boolean) : [];
    var leaveList = leaving ? leaving.ids.map(function (id) { return ws.find(id); }).filter(Boolean) : [];

    return h(IK.Fragment, null,
      h(RK.ReviewBar, { title: 'Workspaces', status: 'approved', size: 'sm', autoHeight: true, plan: false, controls: RK.workspaceControls({ here: 'workspaces' }) }),
      h(IK.AppShell, { nav: 'workspaces', burger: false, scroll: false, workspaces: ws, trialDays: trial ? 3 : undefined },
        h('div', { className: 'pg-split' }, /* the standard head: the title wraps beside its action (wrap is Metrics' own original) — user, 2026-10-22 */
        h(IK.ListPage, { title: 'Workspaces', actions: all.length ? headerAction : null /* empty: the empty state's Create Workspace is the one */ },
          notices.length ? IK.wsAlertStack(notices) : null,
          /* the Insightis search (Metrics, Catalog, Chats): DevartUI SearchInput */
          all.length ? h(D.SearchInput, { value: query, onValueChange: setQuery, onClear: function () { setQuery(''); }, placeholder: 'Search workspaces…', 'aria-label': 'Search workspaces' }) : null,
          h('div', { className: 'flex flex-col gap-2' },
            /* only when there are both: with one kind the chips would filter nothing */
            both ? h('div', { className: 'flex' }, h(D.FilterMenu, {
              label: 'Owner', value: roleF === 'mine' ? 'me' : roleF === 'shared' ? 'shared' : 'any',
              onValueChange: function (v) { setRoleF(v === 'me' ? 'mine' : v === 'shared' ? 'shared' : 'all'); setSelected([]); },
              options: IK.wsOwnerOptions({ me: ws.owned.length, shared: ws.shared.length })
            })) : null,
            /* DevartUI's MetaRow (44px) and ListSelectionBar (37px) differ in height: one 44px slot for
               either, so the table sits at the same place on My Workspaces and Shared */
            bar ? h('div', { className: 'flex min-h-11 items-center' }, h('div', { className: 'min-w-0 flex-1' }, bar)) : null,
            h(IK.WsList, {
              workspaces: list, columnsOf: all, query: query, createButton: createBtn,
              /* before the first workspace: what it is for, on the person's own data (IK.WsIntro) */
              intro: h(IK.WsIntro, { onCreate: create, locked: free, variant: q.intro }),
              selected: sel, onSelect: setSelected,
              onEdit: setRenaming,
              onDelete: function (w) { setDeleting({ ids: [w.id] }); },
              onLeave: function (w) { setLeaving({ ids: [w.id] }); },
              onConnection: function (w, c) { setConn({ w: w, c: c }); },
              onAct: function (kind, w) { setActing({ kind: kind, w: w }); },
              onRenew: function (w) { IK.wsRenewal(ws, [w.id]).request(); }
            }))))),
      pa.dialogs,
      h(IK.WsCreateDialog, {
        open: creating, onOpenChange: setCreating, taken: function (n) { return IK.wsNameTaken(ws.list, n); },
        onCreate: function (n, d) { var id = ws.create(n, d); setCreating(false); location.assign(IK.wsHref('approved/workspaces.html', { w: id, created: '1', q: null })); }
      }),
      h(IK.WsEditDialog, {
        open: !!renaming, onOpenChange: function (o) { if (!o) setRenaming(null); }, name: renaming && renaming.name, desc: renaming && renaming.desc,
        taken: function (n) { return IK.wsNameTaken(ws.list, n, renaming && renaming.id); },
        onSave: function (n, d) { ws.edit(renaming.id, n, d); setRenaming(null); D.toast.success('Workspace updated', { description: n }); }
      }),
      h(IK.WsLeaveConfirm, { list: leaveList,
        open: !!leaving, onOpenChange: function (o) { if (!o) setLeaving(null); },
        onConfirm: function () {
          var gone = leaveList; setLeaving(null); setSelected([]);
          gone.forEach(function (w) { ws.leave(w.id); });
          D.toast.success(gone.length === 1 ? h(IK.Fragment, null, 'You left ', strong(gone[0].name)) : 'You left ' + gone.length + ' workspaces');
        }
      }),
      h(IK.WsDeleteConfirm, { list: delList,
        open: !!deleting, onOpenChange: function (o) { if (!o) setDeleting(null); },
        onConfirm: function () {
          var gone = delList; setDeleting(null); setSelected([]);
          gone.forEach(function (w) { ws.remove(w.id); });
          D.toast.success(gone.length === 1 ? h(IK.Fragment, null, strong(gone[0].name), ' deleted') : gone.length + ' workspaces deleted');
        }
      }),
      /* a connection opened from the list's menu: Connection Details in place — the Owner's with
         Remove from Workspace, an invited one read-only */
      (function () {
        var w = conn && ws.find(conn.w.id), c = w && w.connections.filter(function (x) { return x.id === conn.c.id; })[0], own = w && w.role === 'owner';
        var item = c ? IK.wsConnItem(ws, w, c, { owner: own, free: free, blocked: w.status === 'blocked' }) : null;
        var close = function (o) { if (!o) setConn(null); };
        /* one's own: Data Sources' panel, whole; an invited one: the shared panel, as on Data Sources */
        if (item && own) { var y = pa.connection(item, function () { setConn(null); }); return h(IK.ConnectionDetails, Object.assign({ connection: y.item, onOpenChange: close }, y.opts)); }
        return h(IK.ConnectionDetails, { connection: item, onOpenChange: close, mode: 'shared', metricsHref: IK.wsMetricsHref, renewal: w ? IK.wsRenewal(ws, [w.id]) : null });
      })(),
      aw ? h(IK.WsInviteDialog, {
        open: acting.kind === 'invite', onOpenChange: function (o) { if (!o) setActing(null); }, ws: aw,
        check: IK.wsInviteCheck(aw),
        onInvite: function (e) { ws.invite(aw.id, e); done(aw, 'members'); IK.wsToast.invited(e); }
      }) : null,
      aw ? h(IK.WsAddConnectionsDialog, {
        open: acting.kind === 'add', onOpenChange: function (o) { if (!o) setActing(null); }, ws: aw, connections: IK.WS_CONNECTIONS,
        where: function (cid) { return IK.wsWhereShared(ws.list, cid).filter(function (x) { return x.id !== aw.id; }).map(function (x) { return x.name; }); },
        onAdd: function (list) {
          /* stays on the list — the toast says where it went (user, 2026-10-20) */
          ws.addConnections(aw.id, list); setActing(null);
          /* the way there with it (Open …), as Data Sources' and Metrics' */
          IK.wsToast.added(ws, [aw.id], { kind: 'connection', name: list[0].label, count: list.length, metrics: list.reduce(function (s, c) { return s + (c.metrics || 0); }, 0) });
        }
      }) : null,
      aw ? h(IK.WsShareFilesDialog, {
        open: acting.kind === 'files', onOpenChange: function (o) { if (!o) setActing(null); }, ws: aw, files: IK.WS_FILES,
        onShare: function (list) {
          list.forEach(function (f) { ws.shareFile(aw.id, f); }); done(aw, 'files');
          IK.wsToast.added(ws, [aw.id], { kind: 'file', name: list[0].name, count: list.length, link: false });
        }
      }) : null);

  }

  function WorkspaceView() {
    var q = RK.useWsQuery();
    var ws = IK.useWorkspaces(RK.wsStore(q));
    var plan = IK.usePlan()[0], free = plan === 'free', trial = q.trial && !free;
    /* the details panels are the very ones Data Sources, Files and Metrics open — their actions and dialogs (user,
       2026-10-22: "всі панелі не залежно від місця мали виглядати однаково!", "лишаєм нову панель всюди") */
    /* a metric made here: "See it in Metrics" switches to the tab (none when it is open) */
    var pa = IK.useWsPanelActions(ws, { free: free, seeMetrics: function () { return cur === 'metrics' ? null : function () { setTab('metrics'); }; } });
    IK.wsMarks = { popover: true, renewal: function (by) {
      return IK.wsRenewal(ws, ws.list.filter(function (x) { return x.role === 'member' && x.owner.name === by; }).map(function (x) { return x.id; }));
    } };
    var small = D.useMaxWidth(640);
    var w = ws.find(q.w);
    var owner = !!w && w.role === 'owner', blocked = !!w && w.status === 'blocked';
    var tabQ = RK.useQueryState('tab', 'overview'), tab = tabQ[0], setTab = tabQ[1];
    var dl = R.useState(null), dlg = dl[0], setDlg = dl[1];
    var lvw = R.useState(false), leavingWs = lvw[0], setLeavingWs = lvw[1];
    var dlw = R.useState(false), deletingWs = dlw[0], setDeletingWs = dlw[1];
    var pn = R.useState(null), panel = pn[0], setPanel = pn[1];
    var fpw = R.useState(null), filePrev = fpw[0], setFilePrev = fpw[1];
    var of = R.useState({}), off = of[0], setOff = of[1];
    function dismiss(k) { return function () { var o = Object.assign({}, off); o[k] = true; setOff(o); }; }
    /* no "available again" once it is back (user, 2026-10-23: "не потрібен"); Blocked again → its notice shows again */
    var st = w ? w.id + ':' + w.status : '';
    R.useEffect(function () { if (w && w.status === 'blocked') setOff(function (o) { return Object.assign({}, o, { b: false }); }); }, [st]);

    /* no such workspace (deleted, or another Data world) → the list, in place */
    R.useEffect(function () { if (!w) RK.setWs({ w: null, tab: null }); }, [!w]);
    /* a link from the list may ask for a dialog (do=add | invite): open it once, on the Owner's page */
    R.useEffect(function () {
      var u = new URL(location.href), act = u.searchParams.get('do');
      if (!act) return;
      u.searchParams.delete('do'); history.replaceState(null, '', u);
      if (w && w.role === 'owner' && w.status !== 'blocked' && (act === 'add' || act === 'invite' || act === 'files')) setDlg({ kind: act });
    }, []);
    /* a workspace just created on the list lands here: say so once */
    R.useEffect(function () {
      if (new URLSearchParams(location.search).get('created') && w) {
        D.toast.success(h(IK.Fragment, null, strong(w.name), ' created'), { description: 'Add a connection, then invite members' });
        var u = new URL(location.href); u.searchParams.delete('created'); history.replaceState(null, '', u);
      }
    }, []);
    if (!w) return null;

    function close() { setDlg(null); }
    var lockWs = { feature: 'workspaces', locked: blocked, surface: 'modal', tip: 'Available on Pro' };

    /* ── owner actions ── */
    /* Remove from Workspace asks first — the same confirm and toast as a panel's × (IK.useWsRemoveConfirm via pa) */
    function removeConn(c) {
      pa.askRemove({ kind: 'connection', name: c.label, metrics: c.metrics || 0, wsName: w.name, run: function () { ws.removeConnection(w.id, c.id); } });
    }
    function removeMember(m) {
      setDlg({ kind: 'confirm', title: 'Remove ' + m.name + ' from ' + w.name + '?',
        text: 'They lose access to its connections, metrics and files at once. Their chats stay — answers already given remain.',
        confirm: 'Remove from Workspace', run: function () {
          ws.removeMember(w.id, m.email);
          D.toast.success(h(IK.Fragment, null, strong(m.name), ' removed from ', strong(w.name)));
        } });
    }
    function revoke(i) {
      setDlg({ kind: 'confirm', title: 'Revoke the invitation?',
        text: i.email + ' can’t join ' + w.name + ' with it any more. You can invite them again later.',
        confirm: 'Revoke Invitation', run: function () {
          ws.revoke(w.id, i.email);
          D.toast.success('Invitation revoked', { description: i.email });
        } });
    }
    function resend(i) {
      ws.resend(w.id, i.email);
      D.toast.success(h(IK.Fragment, null, 'Invitation sent again to ', strong(i.email)), { description: 'They get a new email with the link' });
    }
    function stopSharing(ids) {
      var list = w.files.filter(function (x) { return ids.indexOf(x.id) >= 0; }); if (!list.length) return;
      pa.askRemove({ kind: 'file', name: list[0].name, count: list.length, wsName: w.name, run: function () { list.forEach(function (f) { ws.unshareFile(w.id, f.id); }); } });
    }
    function shareFiles() { setDlg({ kind: 'files' }); }

    /* ── the tabs ── */
    var conns = w.connections.map(function (c) {
      var n = Array.isArray(c.metrics) ? c.metrics.length : c.metrics;
      /* its own check time, as Data Sources shows it (user, 2026-10-19: 'чому ласт чек різний') */
      return { id: c.id, name: c.name, label: c.label, desc: c.desc, metrics: n, lastSync: c.lastSync, status: c.status, error: c.error, busy: c.busy, by: w.owner.name, wsName: w.name, locked: !owner && free, muted: !owner && blocked };
    });
    /* the Owner's rows: Data Sources' ⋮ and cells through the very handlers its panel gets, + Remove from Workspace
       (user, 2026-10-22: "⋮ і клітинки як на власних сторінках, Remove from Workspace лишається додатковою дією") */
    function connActs() {
      function run(k) { return function (id) {
        var c = w.connections.filter(function (x) { return x.id === id; })[0]; if (!c) return;
        var f = pa.connection(c, function () { setPanel(null); }).opts[k]; if (f) f();
      }; }
      return { onEdit: run('onEdit'), onTest: run('onTest'), onDetails: run('onDetails'), onDisconnect: run('onDisconnect'), onAddMetric: run('onAddMetric'),
        onAddToWorkspace: run('onAddToWorkspace'), wsLocked: free, locked: free,
        onRemoveHere: function (id) { var c = conns.filter(function (x) { return x.id === id; })[0]; if (c) removeConn(c); } };
    }
    /* a new chat with the file in it, as Files' Add to Chat */
    function toChat(f) { location.assign(IK.wsHref('approved/chat-landing.html', f ? { attach: f.name, w: null, tab: null } : { w: null, tab: null })); }
    var files = w.files.map(toFile);
    /* the preview: an invited workspace's file says who shared it (not where — this is the place) and its
       state; the Owner's carries the row's ⋮ (Remove from Workspace) */
    function openFile(id) {
      var f = files.filter(function (x) { return x.id === id; })[0]; if (!f) { setFilePrev(null); return; }
      /* an invited one's: who shared it and where, as Files shows a shared file */
      setFilePrev(owner ? f : Object.assign({}, f, { by: w.owner.name, locked: free, muted: blocked, wsNames: [w.name], links: IK.wsLinks([w]) }));
    }
    var overview = { value: 'overview', label: 'Overview', body: h(IK.WsOverview, {
      ws: w, me: ws.me, owner: owner, addLocked: blocked, onTab: setTab, onLeave: function () { setLeavingWs(true); },
      onEdit: function () { setDlg({ kind: 'edit' }); }, onDelete: function () { setDeletingWs(true); }, onAdd: function () { setDlg({ kind: 'add' }); },
      onInvite: function () { setDlg({ kind: 'invite' }); }, onShareFiles: shareFiles,
      onConnection: function (c) { setPanel(c.id); } }) };
    var tabs;
    if (owner) {
      var ownMx = IK.wsOwnMetricRows(w);
      var addBtn = h(IK.Locked, lockWs,
        h(D.Button, { variant: 'secondary', size: 'sm', type: 'button', leftSlot: h(IK.Icon, { name: 'plus' }), onClick: function () { setDlg({ kind: 'add' }); } }, 'Add Connection'));
      tabs = [overview,
        { value: 'connections', label: 'Connections', body: conns.length
          ? h(IK.WsConnections, Object.assign({ variant: 'workspace', connections: conns, label: 'Connections in ' + w.name,
              onOpen: function (c) { setPanel(c.id); }, selected: panel }, connActs()))
          : emptyState({ title: 'No connections yet', description: 'Add one so members can use it in their chats', action: addBtn }) },
        /* what its connections share with it — read-only, managed on Metrics (user, 2026-10-19: "де таба метрик?") */
        { value: 'metrics', label: 'Metrics', body: ownMx.some(function (r) { return r.kind === 'metric'; })
          /* Metric Details as on Metrics: its connection's name opens the connection's details over it */
          ? h(IK.WsMetrics, { rows: ownMx, owner: true, ws: ws, free: free, onOpenConnection: function (cid) { setPanel(cid); }, onCreate: function () { pa.createMetric(null); } })
          : emptyState({ title: 'No metrics yet', description: 'Metrics come with the connections you add', action: addBtn }) },
        { value: 'files', label: 'Files', body: files.length
          ? h(IK.WsFiles, { files: files, owner: true, onOpen: openFile, previewId: filePrev && filePrev.id, shareLocked: free,
              /* Files' actions on one's own files, + Remove from Workspace */
              onAction: function (a, ids) {
                var list = w.files.filter(function (x) { return ids.indexOf(x.id) >= 0; });
                if (a === 'stop-sharing') stopSharing(ids);
                else if (a === 'share') pa.shareFiles(list);
                else if (a === 'delete') pa.deleteFiles(list, function () { if (filePrev && ids.indexOf(filePrev.id) >= 0) setFilePrev(null); });
                else if (a === 'add-to-chat') toChat(list[0]);
                else D.toast(ids.length > 1 ? 'Downloading ' + ids.length + ' files' : 'Download started');
              } })
          : emptyState({ title: 'No files yet', description: 'Add files here or from the Files page',
              action: h(IK.Locked, lockWs, h(D.Button, { variant: 'secondary', size: 'sm', type: 'button', leftSlot: h(IK.Icon, { name: 'plus' }), onClick: shareFiles }, 'Add Files')) }) },
        { value: 'members', label: 'Members', body: h(IK.WsMembers, { ws: w, me: ws.me, onRemove: removeMember, onResend: resend, onRevoke: revoke,
            emptyAction: h(IK.Locked, lockWs, h(D.Button, { variant: 'secondary', size: 'sm', type: 'button', leftSlot: h(IK.Icon, { name: 'ws-users' }), onClick: function () { setDlg({ kind: 'invite' }); } }, 'Invite Members')) }) },
      ];
    } else {
      /* inside the workspace its own name is not repeated on each connection (user, 2026-10-19: 'ми і так на маркетингу') */
      var rows = IK.wsMetricRows(ws.list, { own: MY_ALIASES, locked: free, only: w.id }).map(function (r) {
        return r.kind === 'conn' ? Object.assign({}, r, { shared: Object.assign({}, r.shared, { names: [] }) }) : r;
      });
      var nMetrics = rows.filter(function (r) { return r.kind === 'metric'; }).length;
      tabs = [overview,
        { value: 'connections', label: 'Connections', body: conns.length
          ? h(IK.WsConnections, { variant: 'shared', noWs: true, connections: conns, label: 'Connections shared in ' + w.name,
              onOpen: function (c) { setPanel(c.id); }, selected: panel })
          : emptyState({ title: 'No connections yet', description: w.owner.name + ' hasn’t added any yet' }) },
        { value: 'metrics', label: 'Metrics', body: nMetrics
          ? h(IK.WsMetrics, { ws: ws, rows: rows })
          : emptyState({ title: 'No metrics yet', description: 'Metrics come with shared connections' }) },
        { value: 'files', label: 'Files', body: files.length
          ? h(IK.WsFiles, { files: files.map(function (f) { return Object.assign({}, f, { locked: free, muted: blocked, by: w.owner.name, wsName: w.name }); }),
              onOpen: openFile, previewId: filePrev && filePrev.id,
              onAction: function (a, ids) {
                var f = w.files.filter(function (x) { return x.id === ids[0]; })[0];
                if (a === 'view') openFile(ids[0]);
                else if (a === 'add-to-chat') toChat(ids.length === 1 ? f : null);
                else D.toast(a === 'download' ? (ids.length > 1 ? 'Downloading ' + ids.length + ' files' : 'Download started') : 'Opening ' + (f ? f.name : 'the file'));
              } })
          : emptyState({ title: 'No files yet', description: w.owner.name + ' hasn’t added any yet' }) },
        /* who is in it, to look at (user, 2026-10-19: "чому до мемберів нема переходу") — no actions */
        { value: 'members', label: 'Members', body: h(IK.WsMembers, { ws: w, me: ws.me, readOnly: true }) }
      ];
    }
    var cur = tabs.some(function (t) { return t.value === tab; }) ? tab : 'overview';
    /* the title row's action follows the tab, as on Data Sources (Create Connection on My Connections
       only): round primary, locked while Blocked — the Overview's tiles carry their own "+" */
    var TAB_ACTION = {
      connections: ['Add Connection', 'plus', function () { setDlg({ kind: 'add' }); }],
      members: ['Invite Members', 'ws-users', function () { setDlg({ kind: 'invite' }); }],
      /* every Add takes the plus, as Add Connection (user, 2026-10-19: 'чому різні іконки') */
      files: ['Add Files', 'plus', shareFiles],
      /* as Metrics' title action: Create metric, in place */
      metrics: ['Create Metric', 'plus', function () { pa.createMetric(null); }]
    };
    var ta = owner ? TAB_ACTION[cur] : null;
    var titleAction = ta ? h(IK.Locked, lockWs,
      h(D.Button, { variant: 'primary', size: 'sm', rounded: 'full', type: 'button', leftSlot: h(IK.Icon, { name: ta[1] }), onClick: ta[2] }, ta[0]))
      /* a Member leaves from the bottom of the Overview, where the Owner deletes (user, 2026-10-19) */
      : null;

    var trialNote = trial && !off.t;
    /* a Member on Free: what is shared here needs Starter — the plan's notice, as Data Sources, Files and Metrics show it, saying
       what this tab holds (user, 2026-10-23: "якщо в юзера нема доступу до метрик то показується саме сповіщення що в нього нема
       доступу без відповідної підписки") */
    var PLAN_OF = { connections: ['Connectors', 'connections'], metrics: ['Metrics', 'metrics'], files: ['Files', 'shared-files'] };
    var planOf = PLAN_OF[cur] || ['Workspace', 'connections'];
    var notices = [
      blocked && !off.b ? h(IK.WsNotice, { key: 'b', kind: owner ? 'blocked-owner' : 'blocked-member', ws: w, inPage: true, onDismiss: dismiss('b'),
        onRequest: function () { IK.wsRenewal(ws, [w.id]).request(); } }) : null,
      !owner && free && !off.p ? h(IK.WsNotice, { key: 'p', kind: 'shared-plan', module: planOf[0], feature: planOf[1], onDismiss: dismiss('p') }) : null,
      trialNote && owner ? h(IK.WsNotice, { key: 'to', kind: 'trial', owned: [w.name], onDismiss: dismiss('t') }) : null,
      trialNote && !owner ? h(IK.WsNotice, { key: 't', kind: 'trial', sharedFrom: [w.name], onDismiss: dismiss('t'),
        counts: { connections: w.connections.length, metrics: IK.wsMetricRows(ws.list, { only: w.id }).filter(function (r) { return r.kind === 'metric'; }).length, files: w.files.length } }) : null
    ].filter(Boolean);

    var other = function (cid) {
      return IK.wsWhereShared(ws.list, cid).filter(function (x) { return x.id !== w.id; }).map(function (x) { return x.name; });
    };

    return h(IK.Fragment, null,
      h(IK.WsDeleteConfirm, { list: [w],
        open: deletingWs, onOpenChange: setDeletingWs,
        onConfirm: function () {
          var name = w.name; setDeletingWs(false); ws.remove(w.id); RK.setWs({ w: null, tab: null });
          D.toast.success(h(IK.Fragment, null, strong(name), ' deleted'));
        }
      }),
      h(IK.WsLeaveConfirm, { list: [w],
        open: leavingWs, onOpenChange: setLeavingWs,
        onConfirm: function () {
          var name = w.name; setLeavingWs(false); ws.leave(w.id); RK.setWs({ w: null, tab: null });
          D.toast.success(h(IK.Fragment, null, 'You left ', strong(name)));
        }
      }),
      h(RK.ReviewBar, { title: 'Workspaces', status: 'approved', size: 'sm', autoHeight: true, plan: false, controls: RK.workspaceControls({ here: 'workspace', ws: ws, w: w, tab: cur }) }),
      h(IK.AppShell, { nav: 'workspaces', burger: false, scroll: false, workspaces: ws, trialDays: trial ? 3 : undefined },
        h('div', { className: 'pg-split' }, h(IK.ListPage, { title: w.name, truncate: true, actions: titleAction, backLabel: 'Back to workspaces', onBack: function () { RK.setWs({ w: null, tab: null }); } },
          notices.length ? IK.wsAlertStack(notices) : null,
          h(D.Tabs, { value: cur, onValueChange: setTab, className: 'flex flex-col gap-4' },
            /* the strip scrolls sideways on a phone; the scroller wraps the list (not the list itself) and
               reaches 1px under it, so the active tab's underline — which overlaps the list's rule by 1px —
               is not clipped */
            h('div', { className: 'overflow-x-auto scrollbar-none pb-px -mb-px' },
              h(D.TabsList, { className: 'mb-0 flex w-max min-w-full max-sm:gap-1' }, tabs.map(function (t) {
              /* no counts, as Data Sources' tabs; below 640px the triggers take their sm size and the gap
                 tightens to 4px; the Owner's five tabs still pass a phone's width, so the strip scrolls
                 sideways there (no scrollbar), as FilterChips does */
              return h(D.TabsTrigger, { key: t.value, value: t.value, size: small ? 'sm' : undefined, className: 'shrink-0' }, t.label);
            }))),
            tabs.map(function (t) { return h(D.TabsContent, { key: t.value, value: t.value, className: 'flex flex-col gap-4' }, t.body); }))),
          /* the Owner's file: Files' panel, whole — out of this workspace from its Workspaces list (×), no button of its own */
          filePrev ? (owner
            ? (function () { var y = pa.file(filePrev, function () { setFilePrev(null); }); return h(IK.FileDetails, Object.assign({ file: y.item, onClose: function () { setFilePrev(null); } }, y.opts)); })()
            : h(IK.FileDetails, { file: filePrev, onClose: function () { setFilePrev(null); }, onDownload: function () { D.toast('Download started'); }, onAddToChat: function () { toChat(filePrev); },
                renewal: IK.wsRenewal(ws, [w.id]) })) : null)),

      owner ? h(IK.WsInviteDialog, {
        open: !!dlg && dlg.kind === 'invite', onOpenChange: function (o) { if (!o) close(); }, ws: w,
        check: IK.wsInviteCheck(w),
        onInvite: function (e) { ws.invite(w.id, e); close(); setTab('members'); IK.wsToast.invited(e); }
      }) : null,
      owner ? h(IK.WsAddConnectionsDialog, {
        open: !!dlg && dlg.kind === 'add', onOpenChange: function (o) { if (!o) close(); }, ws: w,
        connections: IK.WS_CONNECTIONS, where: other,
        onAdd: function (list) {
          ws.addConnections(w.id, list); close(); setTab('connections');
          IK.wsToast.added(ws, [w.id], { kind: 'connection', name: list[0].label, count: list.length, link: false, metrics: list.reduce(function (s, c) { return s + (c.metrics || 0); }, 0) });
        }
      }) : null,
      owner ? h(IK.WsShareFilesDialog, {
        open: !!dlg && dlg.kind === 'files', onOpenChange: function (o) { if (!o) close(); }, ws: w, files: IK.WS_FILES,
        onShare: function (list) {
          list.forEach(function (f) { ws.shareFile(w.id, f); }); close(); setTab('files');
          IK.wsToast.added(ws, [w.id], { kind: 'file', name: list[0].name, count: list.length, link: false });
        }
      }) : null,
      (function () {
        var c = panel && w.connections.filter(function (x) { return x.id === panel; })[0];
        var item = c ? IK.wsConnItem(ws, w, c, { owner: owner, free: free, blocked: blocked }) : null;
        var close = function (o) { if (!o) setPanel(null); };
        /* the Owner's connection: Data Sources' panel, whole — out of this workspace from its Workspaces list (×) */
        if (item && owner) { var y = pa.connection(item, function () { setPanel(null); }); return h(IK.ConnectionDetails, Object.assign({ connection: y.item, onOpenChange: close }, y.opts)); }
        /* an invited one's: as Data Sources shows a shared connection — its metrics a link to them */
        return h(IK.ConnectionDetails, { connection: item, onOpenChange: close, mode: 'shared', metricsHref: IK.wsMetricsHref, renewal: IK.wsRenewal(ws, [w.id]) });
      })(),
      pa.dialogs,
      owner ? h(IK.WsEditDialog, {
        open: !!dlg && dlg.kind === 'edit', onOpenChange: function (o) { if (!o) close(); }, name: w.name, desc: w.desc,
        taken: function (n) { return IK.wsNameTaken(ws.list, n, w.id); },
        onSave: function (n, d) { ws.edit(w.id, n, d); close(); D.toast.success('Workspace updated', { description: n }); }
      }) : null,
      h(D.ConfirmationDialog, { variant: 'destructive', cancelLabel: 'Cancel',
        open: !!dlg && dlg.kind === 'confirm', onOpenChange: function (o) { if (!o) close(); },
        title: (dlg && dlg.title) || '', description: (dlg && dlg.text) || '', confirmLabel: (dlg && dlg.confirm) || '',
        onConfirm: function () { var run = dlg && dlg.run; close(); if (run) run(); }
      }),
      null);
  }

  /* one page: the list, or the workspace ?w= names */
  function App() {
    var q = RK.useWsQuery();
    /* one Toaster for both screens, so a toast survives the move from the list into a workspace */
    return h(IK.Fragment, null, q.w ? h(WorkspaceView, { key: 'w-' + q.w }) : h(ListView), h(D.Toaster, { position: 'top-right' }));
  }
  IK.mount(App);
})();
</script>
</body>
</html>

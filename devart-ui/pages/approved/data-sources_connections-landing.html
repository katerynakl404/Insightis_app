<script>
/* Data Sources → Connections, rebuilt from pages/approved/data-sources_connections-landing.html.
   Locked rules: page-changes/data-sources_connections-landing.md (apply here unchanged).
   Two tabs — Catalog (IK.DsCatalog) and My Connections (IK.DsConnections, disabled until something
   is connected) — over the app shell, scrolling as a document like the original; the connection
   flows are IK.ConnectDialog (the shared New connection wizard, logo mark), IK.ConnectionDetails
   (Connection details — the one panel, the same on Metrics, Files and a workspace's page),
   IK.DsEditConnectionDialog, IK.DsDisconnectDialog and IK.MxMetricDialog (Add Metric, in place).
   Shared workspaces (on unless ?ws=0; rules: approved/workspace.rules.md): what others shared sits in My
   Connections with the people glyph after its name and an Owner filter; Share via Workspace in the ⋮ and the
   panel (IK.WsAddToWorkspacesDialog). Review switches, as in the original topbar: Plan · Empty/Connected ·
   Loaded/Skeleton · Theme; with workspaces on, Plan is RK.workspaceControls' (Paid · Trial · Free), + Invited
   · Reset Data. */
(function () {
  var IK = window.InsightisKit, RK = window.ReviewKit, D = window.DevartUI, R = window.React, h = IK.h;

  IK.defineIcons({
    'pg-link': '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    'pg-x': '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'
  });

    ['MariaDB', ['IT Operations']], ['Oracle', ['IT Operations']], ['SQL Server', ['IT Operations']],
    ['Elasticsearch', ['IT Operations', 'Business Intelligence']], ['Databricks', ['IT Operations', 'Business Intelligence']],
    ['GitHub', ['IT Operations'], true], ['GitLab', ['IT Operations']], ['Bitbucket', ['IT Operations']],
    ['Salesforce', ['Sales & CRM', 'Business Intelligence'], true], ['HubSpot', ['Sales & CRM', 'Marketing'], true],
    ['Pipedrive', ['Sales & CRM']], ['Zoho CRM', ['Sales & CRM']], ['Freshsales', ['Sales & CRM', 'Support']],
    ['Insightly', ['Sales & CRM']], ['Keap', ['Sales & CRM', 'Marketing']], ['SugarCRM', ['Sales & CRM']],

    ['Amplitude', ['Business Intelligence']], ['Zoho Analytics', ['Business Intelligence']],
    ['Zendesk', ['Support'], true], ['Intercom', ['Support', 'Sales & CRM']], ['Freshdesk', ['Support']], ['ServiceNow', ['Support', 'IT Operations']],
    ['Jira', ['Productivity', 'IT Operations'], true], ['Asana', ['Productivity'], true], ['Monday.com', ['Productivity']],

  function App() {
    /* shared workspaces (approved/workspace.rules.md): on unless ?ws=0 */

    }

    var inList = hasShared;

    var sharers = []; sharedRows.forEach(function (c) { if (sharers.indexOf(c.shared.by) < 0) sharers.push(c.shared.by); });
    var curTab = tab === 'shared' ? (hasConn || inList ? 'connections' : 'catalog') : tab;

    var ownRows = wsOn ? list.map(function (c) { var w = sharedInto(c); return w.length ? Object.assign({}, c, { sharedWith: w.map(function (x) { return x.name; }), links: IK.wsLinks(w) }) : c; }) : list;
    /* Add Metric (row ⋮, an empty Metrics cell, Connection Details): Create metric opens HERE, linked to this
       connection — no move to Metrics (user, 2026-10-20: "при додаванні метрики не перекидати"); the
       count on the row grows, and the toast offers the way to Metrics */
    var am = R.useState(null), metricFor = am[0], setMetricFor = am[1];
    /* Remove from Workspace asks first, as everywhere (IK.useWsRemoveConfirm) */
    var rm = IK.useWsRemoveConfirm();
    function addMetric(name) { setMetricFor(name); }

    var connTabDisabled = !hasConn && !inList;
    function find(name) { return list.find(function (c) { return c.name === name; }) || null; }
    function patch(name, fn) { setList(function (l) { return l.map(function (c) { return c.name === name ? Object.assign({}, c, fn(c)) : c; }); }); }

    /* The Empty / Connected switch is the single source of the demo's state (original dsSegState):

    function setSeg(v) {
      seg[1](v);
      var on = v === 'connected';
      setHasConn(on);
      if (!on && tab === 'connections' && !inList) setTab('catalog');
    }
    function switchTab(v) { if (v === 'connections' && connTabDisabled) return; setTab(v); }

    function bold(label, rest) { return h(IK.Fragment, null, h('strong', null, label), rest); }

      var c = find(name); if (!c) return;

    }
    function test(name) {
      var c = find(name); if (!c || c.busy) return;

      patch(name, function () { return { busy: true }; });
      clearTimeout(timers.current[name]);
      timers.current[name] = setTimeout(function () {
        var ok = !c.willFail;
        var next = { busy: false, status: ok ? 'active' : 'error', lastSync: Date.now(),
                     error: !ok && !c.error ? 'Connection test failed — check credentials and try again' : c.error };
        patch(name, function () { return next; });
        var done = Object.assign({}, c, next);
        if (ok) D.toast.success(bold(label, ' checked successfully'), { description: 'Last check just now', id: name, duration: TOAST_MS });
        else D.toast.error(h(IK.Fragment, null, 'Check failed for ', h('strong', null, label)),
          { description: 'Check failed: ' + IK.dsFailReason(done), id: name, duration: TOAST_MS });
      }, 1500);
    }
    function remove(name) {
      setLeaving(name);
      setTimeout(function () {
        setLeaving(null);
        setList(function (l) {
          var next = l.filter(function (c) { return c.name !== name; });
          if (!next.length) setHasConn(false);
          return next;
        });
        setEntering(name);
      }, 250);
    }
    function create(r) {
      setWizOpen(false);
      /* a new connection brings its connector's built-in metrics (the same counts the workspaces know) */
      var known = (IK.WS_CONNECTIONS || []).filter(function (c) { return c.name === r.connector; })[0];
      setList(function (l) { return l.concat([{ name: r.connector, label: r.label, status: 'active', desc: r.desc, metrics: known ? known.metrics : 0, lastSync: Date.now() }]); });
      setHasConn(true);
      D.toast.success(bold(r.label, ' connected.'), {
        duration: TOAST_MS,
        description: h('a', {
          href: '#', className: 'text-ink-primary underline',
          onClick: function (e) { e.preventDefault(); setTab('connections'); }
        }, 'Manage in My Connections')
      });
    }

    var panelConn = panel ? ownRows.filter(function (c) { return c.name === panel; })[0] || find(panel) : null;
    var editConn = edit ? find(edit) : null;
    var discConn = disc ? find(disc) : null;

    var connTrigger = h(D.TabsTrigger, { value: 'connections', disabled: connTabDisabled }, 'My Connections');
    return h(IK.Fragment, null,
      h(RK.ReviewBar, { title: 'Data Sources', status: 'approved', size: 'sm', autoHeight: true, plan: !RK.wsOwnsPlan(wsq), controls: [
        { label: 'Data state', value: seg[0], onChange: setSeg,
          options: [{ value: 'empty', label: 'Empty' }, { value: 'connected', label: 'Connected' }] },
        { label: 'Page state', value: load[0], onChange: load[1],
          options: [{ value: 'loaded', label: 'Loaded' }, { value: 'skeleton', label: 'Skeleton' }] }
      ].concat(RK.workspaceControls({ here: 'data-sources', sharedTab: curTab === 'shared' })) }),
      h(IK.AppShell, { nav: 'data-sources', burger: false, scroll: false, brandLink: false, accountIcons: 'classic', workspaces: wsOn ? ws : null, trialDays: wsOn && wsq.trial && IK.getPlan() !== 'free' ? 3 : undefined },
        h(IK.ListPage, {
            title: 'Data Sources',
            /* Rule 5: Create Connection lives on My Connections only, and it OPENS THE CATALOG. */

            actions: curTab === 'connections' ? h(IK.Locked, { feature: 'connections', surface: 'modal', locked: free }, h(D.Button, {

          h(D.Tabs, { value: curTab, onValueChange: switchTab, className: 'flex flex-col gap-4' },

              }) : null,
              h(IK.DsCatalog, {
                connectors: CONNECTORS, categories: CATEGORIES,
                category: cat, onCategoryChange: setCat, query: query, onQueryChange: setQuery,
                loading: loading, entering: entering,
                onConnect: function (name) { setConnectFor(name); setWizOpen(true); }
              })),

            /* ── My Connections ── */
            h(D.TabsContent, { value: 'connections', className: 'flex flex-col gap-4' },

              (function () {

                return inList ? h(IK.WsSharedNotices, { ws: ws, free: free, trial: wsq.trial, module: 'Connectors', feature: 'connections', before: [u4], planCovered: free && hasConn })

              list.length === 0 && !inList ? h(D.Banner, {

                  : h(IK.Fragment, null, 'Browse the ', h('b', null, 'Catalog'), ' and click Connect to get started in about ', h('b', null, '2 minutes'), '.'),
                action: h(D.Button, { variant: 'secondary', size: 'sm', type: 'button', onClick: function () { setTab('catalog'); } }, 'Browse Catalog')
              }) : null,

                h(IK.DsConnections, { metricsHref: wsOn ? IK.wsMetricsHref : undefined,
                  connections: (hasConn && IK.wsOwnerPass(ownerF, null) ? ownRows : []).concat(inList ? sharedRows.filter(function (c) { return IK.wsOwnerPass(ownerF, c.shared.by); }) : []), loading: loading, selected: sharedPanel || panel, leaving: leaving,
                  /* no Workspaces column: where a connection is shared lives in its details panel (Access) only (user, 2026-10-20) */
                  wsCol: false,
                  ownerMark: true,
                  /* Owner only where the list mixes others' connections with one's own: alone, every row is You */
                  /* no Owner column in the one list: who shared it is in the people glyph's tooltip */
                  ownerCol: false,
                  onOpen: openRow, onEdit: setEdit, onTest: test, onDisconnect: setDisc, onDetails: errToast, onAddMetric: addMetric,
                  onAddToWorkspace: wsOn ? setAddWs : undefined, wsLocked: free

        h(IK.ConnectionDetails, { connection: panelConn, onOpenChange: function (o) { if (!o) setPanel(null); },
          free: free, metricsHref: wsOn ? IK.wsMetricsHref : null,
          onEdit: function (n) { setPanel(null); setEdit(n); }, onDisconnect: function (n) { setPanel(null); setDisc(n); },
          onTest: test, onDetails: errToast, onAddToWorkspace: wsOn ? function (n) { setAddWs(n); } : undefined, wsLocked: free, onAddMetric: addMetric,

            out = out || [];
            ids.forEach(function (id) { ws.addConnections(id, [c]); });
            out.forEach(function (id) { ws.removeConnection(id, c.id); });
            setAddWs(null);
            IK.wsToast.added(ws, ids, { kind: 'connection', name: c.label, metrics: c.metrics });
          }
        };
      })()) : null,
      h(IK.MxMetricDialog, (function () {
        var c = metricFor ? find(metricFor) : null;
        return {
          open: !!metricFor, mode: 'create',
          initial: c ? { connector: c.label || c.name, link: 'connection' } : {},
          options: list.map(function (x) { return { id: x.label || x.name, label: (x.label || x.name) + ' (' + x.name + ')' }; }),
          findDuplicates: wsOn ? IK.wsMetricDuplicates(ws) : function () { return { name: null, alias: null }; }, sharedAlias: wsOn ? IK.wsSharedAlias(ws) : undefined,
          onOpenChange: function (v) { if (!v) setMetricFor(null); },
          onSave: function (v) {
            var n = metricFor; setMetricFor(null);
            patch(n, function (x) { return { metrics: (x.metrics || 0) + 1 }; });
            IK.wsToast.metricCreated(v.name, (c && (c.label || c.name)) || n, { href: IK.wsHref('approved/metrics-landing.html', {}) });
          }
        };
      })()),
      h(IK.ConnectDialog, { open: wizOpen, connector: connectFor, mark: 'logo', onOpenChange: setWizOpen, onCreate: create }),
      h(IK.DsEditConnectionDialog, {
        open: !!editConn, label: editConn && (editConn.label || editConn.name), desc: editConn && (editConn.desc || ''),
        onOpenChange: function (o) { if (!o) setEdit(null); },
        onSave: function (v) { var n = edit; setEdit(null); patch(n, function () { return { label: v.label, desc: v.desc }; }); }
      }),
      h(IK.DsDisconnectDialog, {
        open: !!discConn, label: discConn && (discConn.label || discConn.name),
        sharedIn: sharedInto(discConn).map(function (w) { return w.name; }),
        onOpenChange: function (o) { if (!o) setDisc(null); },
        /* a shared one leaves its workspaces too: members lose it and its metrics */
        onConfirm: function () {
          var n = disc, k = (IK.WS_CONNECTIONS || []).filter(function (x) { return discConn && x.label === (discConn.label || discConn.name); })[0];
          sharedInto(discConn).forEach(function (w) { ws.removeConnection(w.id, k.id); });
          setDisc(null); remove(n);
          IK.wsToast.disconnected(discConn.label || discConn.name, discConn.metrics);
        }
      }),
      rm.dialog,
      h(IK.UpgradeModal, { feature: 'connections', open: upModal, onOpenChange: setUpModal }),
      h(D.Toaster, { position: 'top-right' }));
  }
  IK.mount(App);
})();
</script>
